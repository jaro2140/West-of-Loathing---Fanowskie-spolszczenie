      en: So... the Warden's got this doofy ferret-dad energy, you know? Likes to putter around in his window box making sure his eyeball bulbs have enough fertilizer... he's <i>that</i> guy. Which makes it easy to forget he's an actual demon from Hell. And what I learned last night about demons from Hell is... they do <i>not</i> eat candy the same way you or I eat candy.
