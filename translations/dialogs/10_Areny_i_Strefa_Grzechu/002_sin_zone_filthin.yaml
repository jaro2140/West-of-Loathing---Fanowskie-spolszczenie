      mowca_lub_kanal: postac_po_prawej
      en: Oh, of course, I haven't really explained anything! I'm Sarah of Brown River. Sarah with an H. I think it looks so much more <i>distinguished</i> that way, don't you? Sara without an H looks so <i>unfinished,</i> like an outhouse without a crescent moon carved into the door. And of course Brown River is where I live with Clamathew and Clarmilla Crunchbert who took me in after my previous foster father Mr. Lenox was killed in a terrible flapjack-flipping accident and left Mrs. Lenox with nineteen children of her own. Three sets of twins, one set of octuplets, and five that came out all joined at the feet in a ring like a big weird starfish. And they <i>would</i> get the croup, and fevers like you wouldn't believe! I was up until sunrise one night keeping little Malaria Lenox's nostrils open with a paste made of chicken soup and wood pulp from the lumber mill, so she wouldn't stop breathing, you know. Once they stop breathing it's a lot harder to-
      pl: Och, oczywiście, właściwie niczego nie wyjaśniłam! Jestem Sarah znad Brown River. Sarah przez H. Uważam, że wygląda to o wiele bardziej <i>dostojnie,</i> nie sądzisz? Sara bez H wygląda tak <i>niedokończenie,</i> jak wychodek bez półksiężyca wyciętego w drzwiach. A Brown River to oczywiście miejsce, w którym mieszkam z Clamathewem i Clarmillą Crunchbertami. Przyjęli mnie po tym, jak mój poprzedni przybrany ojciec, pan Lenox, zginął w strasznym wypadku podczas obracania naleśników i zostawił panią Lenox z dziewiętnaściorgiem własnych dzieci. Trzy pary bliźniąt, jedne ośmioraczki i pięcioro zrośniętych stopami w krąg niczym wielka, dziwna rozgwiazda. I <i>ciągle</i> chorowały na krup oraz dostawały gorączki, jakich sobie nie wyobrażasz! Pewnej nocy do świtu utrzymywałam nozdrza małej Malarii Lenox otwarte pastą z rosołu i pulpy drzewnej z tartaku, żeby nie przestała oddychać. Wiesz, kiedy już przestają oddychać, znacznie trudniej jest-
