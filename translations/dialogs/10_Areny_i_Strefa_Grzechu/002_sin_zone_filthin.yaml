      kontekst: data.json:scripts.sinzonefilthin_spittoonzone_sarah.intro2
      linia: 4
      sekcja_skryptu: intro2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: '"It was all very romantic but I cried <i>so much</i>," I told the spit god. "I''d never had a bosom friend before. Have you ever made a bosom friend only to have them ripped from your very bosom, my dear god of spit? It''s so tragic that I''ve forgotten what I meant to pray about. Oh, that''s right!" I said when I suddenly remembered what I had wanted to pray about. "Please, dear god of spit, please send me a champion to help me find Clarmilla''s brooch, or I''ll never be allowed to go to the church picnic, and I''ll never have a chance to convince Violet''s mother to love spittoons as much as I do and let Violet be my bosom friend again," is what I said in my prayer to the god of spit. And now <i>you''re</i> here! It proves that I was right to believe in miracles, even though they told me at the orphanage I should never expect anything in my miserable worthless life beyond constant disappointment.'
      pl: '"To było bardzo romantyczne, ale płakałam <i>strasznie dużo</i>," powiedziałam bogu śliny. "Nigdy wcześniej nie miałam bratniej przyjaciółki. Czy zdarzyło ci się kiedyś zyskać bratnią przyjaciółkę, tylko po to, by wyrwano ją prosto z twojego łona, mój drogi boże śliny? To takie tragiczne, że zapomniałam, o co właściwie chciałam się pomodlić. A, właśnie!" powiedziałam, gdy nagle sobie przypomniałam, o co chciałam się modlić. "Proszę, drogi boże śliny, proszę, ześlij mi bohatera, który pomoże mi odnaleźć broszkę Clarmilli, bo inaczej nigdy nie pozwolą mi iść na kościelny piknik i nigdy nie będę miała szansy przekonać matki Violet, żeby pokochała spluwaczki tak jak ja, i pozwoliła Violet znów być moją bratnią przyjaciółką," tak brzmiała moja modlitwa do boga śliny. A teraz <i>ty</i> tu jesteś! To dowód, że słusznie wierzyłam w cuda, chociaż w sierocińcu mówili mi, że w moim nędznym, nic niewartym życiu nie powinnam się spodziewać niczego poza ciągłym rozczarowaniem.'
