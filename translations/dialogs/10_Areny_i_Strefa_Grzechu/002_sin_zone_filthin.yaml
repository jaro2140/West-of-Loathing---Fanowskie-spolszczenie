    - id: wol_facb863c0b6b71135856
      kontekst: data.json:scripts.sinzonefilthin_spittoonzone_sarah.start
      linia: 1
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Thank goodness you've arrived! I prayed to the god of spit for you, you know. I put my hands together just like this, and I looked up towards the heavens -- then I looked down again very quickly because tobacco juice was dripping into my eyes -- and I said "Dear god of spit, I pray that you exist and that you will be bosom friends with me, for I have no bosom friend except Violet Beck, and <i>she</i> has been forbidden to speak with me because her mother believes I'm a filthy wicked child who is too fond of spittoons. 'You'll come to a bad end, my Violet, if I let you keep hanging around spittoons with that filthy wicked orphan child,' is what Violet said her mother said. She snuck out to meet me one last time in our secret outhouse -- Violet did, not her mother, I mean -- and we bid our goodbyes <i>so</i> tearfully. Violet gave me a vial of her spit in a locket to remember her by, and I gave her a wad of gum I'd been chewing for months."
      pl: 'Dzięki niebiosom, że przybywasz! Modliłam się o ciebie do boga śliny. Złożyłam ręce o tak i spojrzałam ku niebiosom — a potem bardzo szybko spuściłam wzrok, bo sok tytoniowy kapał mi do oczu — i powiedziałam: „Drogi boże śliny, modlę się, żebyś istniał i został moim serdecznym przyjacielem, bo nie mam żadnej serdecznej przyjaciółki prócz Violet Beck, a <i>jej</i> zabroniono ze mną rozmawiać, gdyż matka uważa mnie za brudne, nikczemne dziecko, które za bardzo lubi spluwaczki. «Źle skończysz, moja Violet, jeśli pozwolę ci dalej przesiadywać przy spluwaczkach z tym brudnym, nikczemnym sierocym dzieckiem» — tak według Violet powiedziała jej matka. Violet wymknęła się, żeby po raz ostatni spotkać się ze mną w naszej sekretnej wygódce — Violet, nie jej matka — i <i>tak</i> łzawo się pożegnałyśmy. Violet dała mi na pamiątkę fiolkę swojej śliny w medalionie, a ja jej kulkę gumy, którą żułam od miesięcy.”'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
