      linia: 11
      sekcja_skryptu: silentmovie
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Wasco formed a band with the other musicians you sent to Dirtwater, and called it Wasco's Explosion.  He told jokes between songs, which people tolerated because the music was pretty good.
      pl: Wasco założył zespół z muzykami, których wysłałeś do Dirtwater, i nazwał go Wasco's Explosion. Opowiadał żarty między piosenkami, co ludzie tolerowali, bo muzyka była całkiem niezła.
