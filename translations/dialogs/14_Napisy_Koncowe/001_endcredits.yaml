      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Wasco and the other musicians started a folk band which he insisted on calling Wasco and Sons.  They had one song that people really liked, and a lot of other songs that people more or less tolerated.
      pl: Wasco i pozostali muzycy założyli zespół folkowy, który uparcie nazywał Wasco and Sons. Mieli jedną piosenkę, którą ludzie naprawdę lubili, i mnóstwo innych, które ludzie mniej więcej tolerowali.
