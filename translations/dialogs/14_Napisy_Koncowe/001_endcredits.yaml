      pl: Artyści, których wysłałeś do Dirtwater, utworzyli największy zespół w historii muzyki. Idealna unia perkusji, strun i technologii — natychmiast zapisali się w kulturze Loathing. Piosenki innowacyjne, scena spektakularna, a teksty na wkładkach płyt niezwykle pomysłowe i ciekawe.
