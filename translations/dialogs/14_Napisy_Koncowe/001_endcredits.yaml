      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Led by the infernal sadist Duke Bovicus, the cow army thundered east, toward Dirtwater.
      pl: Na czele z piekielnym sadystą, księciem Bovicusem, armia krów z grzmotem ruszyła na wschód, w stronę Dirtwater.
