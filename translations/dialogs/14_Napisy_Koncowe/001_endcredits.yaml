      linia: 2
      sekcja_skryptu: silentmovie
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Frisco's loose moral atmosphere and the opening of a mercury mine a ways down the peninsula meant she stayed too busy to worry much, most days.
      pl: Luźna moralność Frisco i otwarcie kopalni rtęci gdzieś na końcu półwyspu sprawiały, że większość dni była zbyt zajęta, by się specjalnie martwić.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
