      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The jaw harp lady and the weird El Vibrato thing you sent to Dirtwater formed a duo called Plunk 'n' Boop.  They became one of Frisco's most popular attractions.
