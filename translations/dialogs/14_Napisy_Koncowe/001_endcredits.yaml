- kolejnosc_w_danych_gry: 1271
  skrypt: endcredits_dirtwater
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 12
  sekcje:
  - etykieta: level1
    wpisy:
    - id: wol_621a90df6df6ed23fdcf
      kontekst: data.json:scripts.endcredits_dirtwater.level1
      linia: 1
      sekcja_skryptu: level1
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Dirtwater stayed more or less the way you found it.  People went about their business, but there was never much excitement.  Nobody new ever showed up.
      pl: Dirtwater pozostało mniej więcej takie, jak je zastałeś. Ludzie zajmowali się swoimi sprawami, ale nigdy nie było zbyt wiele emocji. Nikt nowy nigdy się nie pojawił.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_0f322cc55eb5be09eb9f
      kontekst: data.json:scripts.endcredits_dirtwater.level1
      linia: 2
      sekcja_skryptu: level1
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Things got a little... stagnant.
      pl: Trochę... pogniło.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: level5
    wpisy:
    - id: wol_06c48de234f79698d97e
      kontekst: data.json:scripts.endcredits_dirtwater.level5
      linia: 3
      sekcja_skryptu: level5
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Dirtwater became, relatively speaking, a thriving metropolis.  Thanks to your efforts as a commerce ambassador and all-around helpful stranger, the once sleepy town became a shining oasis in a barren land.
      pl: Dirtwater stało się, względnie mówiąc, tętniącą metropolią. Dzięki twoim wysiłkom jako ambasador handlu i pomocny nieznajomy, niegdyś senne miasteczko zamieniło się w lśniącą oazę na jałowej ziemi.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_77bc909deb089958b821
      kontekst: data.json:scripts.endcredits_dirtwater.level5
      linia: 4
      sekcja_skryptu: level5
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Every man, woman and child in the town knew your name.
      pl: Każdy mężczyzna, kobieta i dziecko w mieście znało twoje imię.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_6e3019ed87b4f7c29066
      kontekst: data.json:scripts.endcredits_dirtwater.level5
      linia: 5
      sekcja_skryptu: level5
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: They even put up a little plaque with your name on it in your old room at the Jewel.
      pl: Powiesili tabliczkę z twoim imieniem w twoim starym pokoju w Jewel.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_5745fe0cf22faaa4d138
      kontekst: data.json:scripts.endcredits_dirtwater.level5
      linia: 6
      sekcja_skryptu: level5
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Little did they know.
      pl: Mało kto wiedział.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: level4
    wpisy:
    - id: wol_48bcc5f19ff1b5da3423
      kontekst: data.json:scripts.endcredits_dirtwater.level4
      linia: 7
      sekcja_skryptu: level4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You were remembered as a local hero in Dirtwater.  Thanks to your efforts, it became twice the town it was before you got there.
      pl: Zapamiętano cię jako lokalnego bohatera w Dirtwater. Dzięki tobie miasteczko stało się dwa razy większe niż przed twoim przybyciem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_fe4c6bcbe5d914416fce
      kontekst: data.json:scripts.endcredits_dirtwater.level4
      linia: 8
      sekcja_skryptu: level4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: They even put a statue of you on the main street.  It washed away the first time it rained because they made it out of salt, but still, it's the thought that counts, right?
      pl: Postawili nawet twój pomnik na głównej ulicy. Pierwszy deszcz go zmył, bo zrobili go z soli — ale liczy się intencja, prawda?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_5745fe0cf22faaa4d138
      kontekst: data.json:scripts.endcredits_dirtwater.level4
      linia: 9
      sekcja_skryptu: level4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Little did they know.
      pl: Mało kto wiedział.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: level3
    wpisy:
    - id: wol_59209e40648a2eaf8142
      kontekst: data.json:scripts.endcredits_dirtwater.level3
      linia: 10
      sekcja_skryptu: level3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You left Dirtwater a nicer town than you found it.  The streets were a little safer, the people were a little wealthier, and the children liked ice cream just a little more.
      pl: Zostawiłeś Dirtwater ładniejsze miasto niż je zastałeś. Ulice były trochę bezpieczniejsze, ludzie trochę bogatsi, a dzieci lubiły lody trochę bardziej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_b7c60b62fd5f9fab308c
      kontekst: data.json:scripts.endcredits_dirtwater.level3
      linia: 11
      sekcja_skryptu: level3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The ice cream thing might not have been because of you, I guess.
      pl: Sprawa z lodami chyba niekoniecznie była przez ciebie, zgaduję.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: level2
    wpisy:
    - id: wol_a2dced2d0ec5be5aa256
      kontekst: data.json:scripts.endcredits_dirtwater.level2
      linia: 12
      sekcja_skryptu: level2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You left Dirtwater a little better off than it was when you found it, but it remained more or less the same sleepy town it always was.
      pl: Zostawiłeś Dirtwater trochę lepsze niż je zastałeś, ale pozostało mniej więcej tym samym sennym miasteczkiem co zawsze.
