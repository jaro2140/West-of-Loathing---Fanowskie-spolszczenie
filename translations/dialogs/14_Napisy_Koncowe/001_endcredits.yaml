      linia: 2
      sekcja_skryptu: silentmovie
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: They thundered east, forming a gigantic, single-minded herd.
      pl: Ruszyli z grzmotem na wschód, tworząc gigantyczne, jednomyślne stado.
