      sekcja_skryptu: silentmovie
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The washboard guy and the El Vibrato thing you sent to Dirtwate formed a weird experimental band called The Automatic Laundry.  They played small gigs in Frisco before exploding in popularity after the invention of radio.
      pl: Facet od washboardu i rzecz El Vibrato, które wysłałeś do Dirtwater, założyli dziwny zespół eksperymentalny The Automatic Laundry. Grali małe koncerty we Frisco, zanim wybuchła popularność radia.
