      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Wasco and the washboard guy started touring under the name Washco.  People seemed to like them.
      pl: Wasco i gość od washboardu wyruszyli w trasę pod nazwą Washco. Ludziom się podobali.
