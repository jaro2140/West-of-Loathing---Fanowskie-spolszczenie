      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The musicians you sent to Dirtwater formed a band called The Pony Express.  Their music was a little too esoteric for most peoples' tastes, but their fans claimed they were just ahead of their time.
      pl: Muzycy, których wysłałeś do Dirtwater, założyli zespół The Pony Express. Muzyka była zbyt ezoteryczna dla większości, ale fani twierdzili, że wyprzedzali swoje czasy.
