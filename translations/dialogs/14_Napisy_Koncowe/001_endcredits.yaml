      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: In 1906, all of the remaining cows in the West were simultaneously activated by some kind of signal from Hell.
      pl: W 1906 roku wszystkie pozostałe krowy na Zachodzie zostały jednocześnie aktywowane przez jakiś sygnał z Piekła.
