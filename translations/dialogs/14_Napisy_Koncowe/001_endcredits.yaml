      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The musicians you sent to Dirtwater formed a protest band called This Machine Kills Hillbillies.  Nobody was ever quite sure what they were protesting.
      pl: Muzycy, których wysłałeś do Dirtwater, założyli zespół protestacyjny This Machine Kills Hillbillies. Nikt nigdy nie był do końca pewien, przeciw czemu protestują.
