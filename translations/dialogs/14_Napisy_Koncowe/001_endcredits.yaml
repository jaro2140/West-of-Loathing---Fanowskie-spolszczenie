      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The washboard and guitar duo that you sent to Dirtwater started touring as Cornpone Holiday.  They were a big hit in Frisco, but some people claimed that their fans were all listening ironically.
      pl: Duet z washboardem i gitarą, który wysłałeś do Dirtwater, wyruszył w trasę jako Cornpone Holiday. W Frisco odnieśli wielki sukces, choć niektórzy twierdzili, że fani słuchają ich ironicznie.
