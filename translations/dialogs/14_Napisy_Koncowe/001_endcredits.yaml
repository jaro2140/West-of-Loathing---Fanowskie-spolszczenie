      linia: 10
      sekcja_skryptu: silentmovie
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The musicians you sent to Dirtwater formed a soulful, low-fi band called The Onion Motel.  They don't play very often anymore, but people still remember them very fondly.
      pl: Muzycy, których wysłałeś do Dirtwater, założyli nastrojowy zespół lo-fi The Onion Motel. Rzadko już grają, ale ludzie wspominają ich bardzo ciepło.
