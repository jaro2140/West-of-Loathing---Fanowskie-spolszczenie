      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Dissatisfied with the thought of returning to her old life in Boring Springs, Doc Alice opened a free clinic in Frisco and lived out the rest of her days as a practicing doctor.
      pl: Niezadowolona z myśli o powrocie do starego życia w Boring Springs, Doc Alice otworzyła darmową klinikę we Frisco i spędziła resztę dni jako lekarz w praktyce.
