      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Fortunately, since you somehow managed to trap Duke Bovicus on this side of the ground <i>and</i> cleanse yourself of your bovine blood-taint, the army of cows had nobody to lead them.
      pl: Na szczęście, skoro jakoś udało ci się uwięzić księcia Bovicus po tej stronie ziemi <i>i</i> oczyścić się z bydlęcej plamy krwi, armia krów nie miała kogo poprowadzić.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
