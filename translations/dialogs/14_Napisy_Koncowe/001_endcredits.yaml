      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The musicians you sent to Dirtwater formed a band called Wasco and the Pufferfish.  They had a few hits, then mostly faded into obscurity, though you'd occasionally hear Wasco in a radio ad, years later.
