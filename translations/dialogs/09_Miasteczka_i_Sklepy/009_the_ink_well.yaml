      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I don't know ghost taxonomy! What do I look like, a ghostologist? Do I look like I graduated from Ghost University with a major in ghosts and a minor in smaller ghosts?
      pl: Nie znam się na taksonomii duchów! Na co ja wyglądam, na duchologa? Wyglądam, jakbym skończył Uniwersytet Duchowy z kierunkiem duchy i specjalizacją mniejsze duchy?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
