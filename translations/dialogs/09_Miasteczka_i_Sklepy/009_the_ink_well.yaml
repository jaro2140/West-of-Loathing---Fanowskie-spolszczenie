  - etykieta: swellup
    wpisy:
    - id: wol_bc3274e2b5e426865c6a
      kontekst: data.json:scripts.inkwell_floor1_examinebears.swellup
      linia: 8
      sekcja_skryptu: swellup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Having heard that bears won't attack you if they think you're very large, you bulge out your biceps, puff out your pecs, and generally do everything in your power to make yourself look huge.
      pl: Słyszałeś, że niedźwiedzie nie atakują, jeśli myślą, że jesteś bardzo duży, więc napinasz bicepsy, wypinasz klatkę i ogólnie robisz wszystko, żeby wyglądać ogromnie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_29c59083ba71fc599819
      kontekst: data.json:scripts.inkwell_floor1_examinebears.swellup
      linia: 9
      sekcja_skryptu: swellup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bears take turns poking your deltoids and agree amongst themselves that you're too perfect a specimen to snack on, then exit the cave.
      pl: Niedźwiedzie na przemian szturchają twoje mięśnie naramienne i uzgadniają między sobą, że jesteś zbyt doskonałym okazem na przekąskę, po czym wychodzą z jaskini.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_f8ea1369dec543ff6cc7
      kontekst: data.json:scripts.inkwell_floor1_examinebears.swellup
      linia: 10
      sekcja_skryptu: swellup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: At least, you assume that's what they agreed on. It's possible they had an entire conversation about how you smell real bad and probably taste real bad too, and you'll never know, because you don't speak bear.
      pl: Zakładasz przynajmniej, że o tym się dogadali. Możliwe, że prowadzili całą rozmowę o tym, jak fatalnie śmierdzisz i pewnie fatalnie smakujesz — i nigdy się nie dowiesz, bo nie znasz niedźwiedziego.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_fad141569a80e7e8ece7
