      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, yes! I have to stay near the well so I can warn everyone not to get near it because of the g-g-g-ghosts!
      pl: Tak! Muszę być blisko studni, żeby ostrzec wszystkich, żeby się do niej nie zbliżali z powodu duchów.
