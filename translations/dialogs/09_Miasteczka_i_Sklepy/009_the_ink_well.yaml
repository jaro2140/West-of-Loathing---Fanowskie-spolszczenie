      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Have you met my bird friend Obelisk? He is a repeating raven, a rare type of talking bird that hides in the nearby hills. I have an affinity with his species, and was able to coax several of them into the well with a large bag of birdseed.
