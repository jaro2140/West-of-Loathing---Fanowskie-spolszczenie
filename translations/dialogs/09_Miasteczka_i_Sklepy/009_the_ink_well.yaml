  - etykieta: foraginglesson
    wpisy:
    - id: wol_2ccbf37d5d7f735fafb6
      kontekst: data.json:scripts.inkwell_floor1_examinebears.foraginglesson
      linia: 5
      sekcja_skryptu: foraginglesson
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You spend some time teaching the bears about the finer points of cactus fruit picking (pun intended) and how to get enough protein in their diet by using a stick to collect ants. They listen intently, then grunt a thank you and exit the cave.
      pl: Spędzasz trochę czasu, ucząc niedźwiedzie subtelności zbierania owoców kaktusa (gra słów zamierzona) i jak uzupełnić białko w diecie patykiem do zbierania mrówek. Słuchają uważnie, chrząkają dziękując i wychodzą z jaskini.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_6218920ce49abb759136
      kontekst: data.json:scripts.inkwell_floor1_examinebears.foraginglesson
