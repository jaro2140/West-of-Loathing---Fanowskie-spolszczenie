      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: To be concise, which I fear I have failed to be up to this point, yes. Not a drop of ink exists in this well that did not dry on the pages of my novel, except for the last vestiges which I used to scrawl the warning messages upstairs.
      pl: Mówiąc krótko — co, obawiam się, dotąd mi się nie udało — tak. W tej studni nie ma ani kropli atramentu, która nie wyschła na stronach mojej powieści, z wyjątkiem ostatnich resztek użytych do nabazgrania ostrzeżeń na górze.
