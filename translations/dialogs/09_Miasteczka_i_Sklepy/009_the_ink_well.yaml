      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ghosts! When we showed up today, the well was full of ghosts, and everyone else got very creeped out and ran away. I started to run away too! But I decided someone needed to stay and warn people about the g-g-g-g... you get the picture.
      pl: Duchy! Kiedy dziś przyszliśmy, studnia była pełna duchów i wszyscy inni potwornie się wystraszyli i uciekli. Też zacząłem uciekać! Ale uznałem, że ktoś musi zostać i ostrzegać ludzi przed d-d-d-du... sami rozumiecie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
