      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I owe you a tremendous debt which this trifle cannot begin to repay, however, it is all I have to offer. Now, if you'll kindly excuse me, I have approximately three years worth of hole to dig while I weep for my lost Lenora.
      pl: Mam u ciebie ogromny dług, którego ten drobiazg nawet w części nie spłaci, ale to wszystko, co mogę ofiarować. A teraz wybacz łaskawie — czekają mnie jakieś trzy lata kopania dziury i opłakiwania mojej utraconej Lenory.
