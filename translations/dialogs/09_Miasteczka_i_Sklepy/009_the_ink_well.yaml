      en: Oh, right, the thing with the warning messages and the spooky ghosts! It's been such a long conversation that I almost forgot.
      pl: Och, racja, ta sprawa z ostrzeżeniami i upiornymi duchami! Rozmawiamy już tak długo, że prawie zapomniałem.
