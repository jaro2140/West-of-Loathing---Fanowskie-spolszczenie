      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Rafael stoops down next to the dowsing pen and pulls it out of the earth, leaving a small hole through which a tiny fountain of ink burbles up. From this, he fills a small bottle, and hands it to you.
      pl: Rafael schyla się przy piórze różdżkowym i wyciąga je z ziemi, zostawiając mały otwór, z którego bulgocze strużka atramentu. Napełnia małą butelkę i podaje ci ją.
