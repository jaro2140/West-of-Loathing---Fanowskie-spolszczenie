      sekcja_skryptu: lenora
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I regret to say that in my youth and wounded state of mind I responded with a pithy but detailed list of all the ways in which being married to the ghost stepmother would be preferable, cold spectral hands notwithstanding, and Lenora has not spoken to me since. Which I understand and respect. Ah, lost Lenora!
      pl: Z przykrością wyznaję, że w młodości i zranionym stanie ducha odpowiedziałem zwięzłą, lecz szczegółową listą wszystkich względów, dla których małżeństwo z duchem macochy byłoby lepszym losem, zimnych widmowych dłoni nie wyłączając — i od tamtej pory Lenora się do mnie nie odezwała. Co rozumiem i szanuję. Ach, utracona Lenoro!
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
