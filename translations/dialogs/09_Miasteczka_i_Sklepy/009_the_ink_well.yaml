      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Rafael shows you the fountain pen in his hand. This is the first good close view of it you've gotten, and you can see now that the handle is forked like a Y.
      pl: Rafael pokazuje ci pióro wieczne w dłoni. Pierwszy raz widzisz je z bliska i widać, że trzonek jest rozwidlony jak Y.
