      en: Personally, if I were you, I would construct a contraption of wire and bone, sunk twenty metres into an earthen pit, with a cage at the bottom to ensnare my mortal form and a sword suspended above me on a spider's thread of silken filigree, then have my former lover cut the thread with a pearl-handled knife, but I understand if that's a little high-maintenance and you'd prefer to stab me cleanly through my traitorous heart.
