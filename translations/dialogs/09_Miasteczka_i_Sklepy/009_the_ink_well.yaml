      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It's a dowsing pen used for locating ink deep underground. They say that the ability to use one is a mysterious, mystical gift which one-quarter of the population is born with and the rest can never learn. To my greatest chagrin, I fear I was born without the ability, because this thing has been as cold and unresponsive in my hands as the corpse of a bride drowned on her wedding night.
      pl: To różdżkarskie pióro do odnajdywania atramentu głęboko pod ziemią. Powiadają, że zdolność posługiwania się nim to tajemniczy, mistyczny dar, z którym rodzi się jedna czwarta populacji, a reszta nigdy nie może się go nauczyć. Ku mej największej zgryzocie obawiam się, że urodziłem się bez tego talentu, gdyż w mych dłoniach owo narzędzie było równie zimne i obojętne jak zwłoki panny młodej utopionej w noc poślubną.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
