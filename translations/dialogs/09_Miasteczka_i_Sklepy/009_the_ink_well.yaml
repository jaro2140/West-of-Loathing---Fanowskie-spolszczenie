      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: She is not lost to the rest of the world, but she is lost to me. She said she didn't want to be married, she wanted to focus on her career, and if her ghost stepmom thought I was so expletive nice, then her ghost stepmom could marry me herself.
      pl: Nie zniknęła dla reszty świata, ale dla mnie jest stracona. Powiedziała, że nie chce małżeństwa, tylko skupić się na karierze, a jeśli jej duchowa macocha uważa mnie za tak przekleńczo miłego, to może sama za mnie wyjść.
