- kolejnosc_w_danych_gry: 2073
  skrypt: professor_combatitemfab
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 24
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_b4cb6eed37efd7ccd399
      kontekst: data.json:scripts.professor_combatitemfab.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This machine turns El Vibrato scrap into single-use combat items.  That's what the Perfessor said, and I'm confirming it for you.
      pl: Ta maszyna zamienia złom El Vibrato w jednorazowe przedmioty bojowe. Tak powiedział Perfessor — i potwierdzam.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_4fad176cddb6e875e3d4
      kontekst: data.json:scripts.professor_combatitemfab.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's a little note on the side where he describes the different things you can make with it.
      pl: Z boku jest krótka notatka, co z tego można zrobić.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_483c15b17ed71e45e43a
      kontekst: data.json:scripts.professor_combatitemfab.start
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It can make a grenade, which you assume blows things up.
      pl: Może zrobić granat, który — zakładasz — wysadza rzeczy w powietrze.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_4f82e0662bf3a298b283
      kontekst: data.json:scripts.professor_combatitemfab.start
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It can make something called a "maintenance teleporter," which the Perfessor says will banish any hostile El Vibrato construct.
      pl: Może zrobić coś, co nazywa się „teleporter konserwacyjny” — Perfessor twierdzi, że wypędzi nim każdego wrogiego konstrukta El Vibrato.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7520d233c5367bb6713d
      kontekst: data.json:scripts.professor_combatitemfab.start
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It can make an autonomous construct that will help you win fights by hurting your enemies, or one that can help you win fights by healing you and your allies.
      pl: Może stworzyć autonomiczny konstrukt, który pomoże ci wygrywać walki, raniąc wrogów, albo taki, który pomoże wygrywać walki, lecząc ciebie i sojuszników.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_d767468501b29652a784
      kontekst: data.json:scripts.professor_combatitemfab.start
      linia: 6
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Sounds great
      pl: Brzmi świetnie
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
