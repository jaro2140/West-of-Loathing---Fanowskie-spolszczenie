      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The workbench has a little burner and crucible for melting silver things, and some bullet molds.  It seems pretty straightforward. There's also a vice, so you could smash silver bullets into needles if you wanted to.
      pl: Na warsztacie jest mały palnik i tygiel do topienia srebrnych rzeczy oraz formy do kul. Wygląda prosto. Jest też imadło — mógłbyś rozbić srebrne kule na igły, gdybyś chciał.
