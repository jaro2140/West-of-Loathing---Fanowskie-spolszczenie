- kolejnosc_w_danych_gry: 2505
  skrypt: silversmith_shelf
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 9
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_8dad4c949ba43e6e1a0d
      kontekst: data.json:scripts.silversmith_shelf.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bookshelf contains like 90 copies of Johnny Tremain.
      pl: Na półce jest jakieś 90 egzemplarzy „Johnny'ego Tremain”.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_dbe108e64be0754dc38c
      kontekst: data.json:scripts.silversmith_shelf.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's something weird about it, though.  It's... too neatly organized.  Like maybe the guy was hiding something.
      pl: Jest w tym coś dziwnego — zbyt schludnie poukładane. Jakby ktoś coś ukrywał.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_036e2e8385245ba6106c
      kontekst: data.json:scripts.silversmith_shelf.start
      linia: 3
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Search for secrets [10 Moxie]
      pl: Szukaj sekretów [10 Ikra]
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '[10 Moxie]'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: search
    wpisy:
    - id: wol_dd042c3efa735dc1eb8c
      kontekst: data.json:scripts.silversmith_shelf.search
      linia: 4
      sekcja_skryptu: search
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Tucked behind one of the books you find a small envelope filled with receipts.  About half of them are from a shop called The Silver Plater.
      pl: Za jedną z książek znajdujesz małą kopertę z paragonami. Około połowa z nich jest ze sklepu o nazwie „Posrebrzacz”.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_a1147600a2dd7a123e28
      kontekst: data.json:scripts.silversmith_shelf.search
      linia: 5
      sekcja_skryptu: search
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He was crooked!  The silversmith was selling cheap fakes!
      pl: Był nieuczciwy! Jubiler sprzedawał tanie podróbki!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_aa0e6060fdcac5ae0eea
      kontekst: data.json:scripts.silversmith_shelf.search
      linia: 6
      sekcja_skryptu: search
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Oh well.  He's gone now, and so are most of his customers.  No sense in stirring up trouble at this point.
      pl: No cóż. Poszedł, a z nim większość klientów. Nie ma sensu teraz mieszać.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_3744ad5ed3ada9f4cd67
      kontekst: data.json:scripts.silversmith_shelf.search
      linia: 7
      sekcja_skryptu: search
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You write down the location of the shop.  Might come in handy.
      pl: Zapisujesz lokalizację sklepu. Może się przydać.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
