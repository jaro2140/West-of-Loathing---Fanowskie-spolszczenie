      linia: 4
      sekcja_skryptu: grace
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Well, one day they were here, and the next day they were bloodstains.  I had the creepiest dream that night.  I dreamt a little girl with big, empty white eyes jumped in through my bedroom window and asked me if I wanted to have a tea party.
      pl: No, pewnego dnia tu byli, a następnego zostali plamami krwi. Tej nocy miałem najbardziej mrożący krew sen. Śniło mi się, że mała dziewczynka z wielkimi, pustymi białymi oczami wskoczyła przez okno sypialni i zapytała, czy chcę herbatkę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
