      linia: 8
      sekcja_skryptu: keepsake
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Aw dangit. I was hopin' not to see that again. I locked that up with the keys inside on purpose. Too many bad memories. I 'preciate the intention, that's real kind of you, but go ahead an' keep it.
      pl: O rany. Liczyłem, że tego już nie zobaczę. Celowo to zamknąłem z kluczami w środku. Za dużo złych wspomnień. Doceniam intencję, to naprawdę miłe z twojej strony, ale zatrzymaj to.
