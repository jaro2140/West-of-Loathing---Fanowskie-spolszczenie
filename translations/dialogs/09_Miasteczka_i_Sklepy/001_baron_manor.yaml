- kolejnosc_w_danych_gry: 232
  skrypt: baronmanor_topiaryletter
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 3
  sekcje:
  - etykieta: invpopup
    wpisy:
    - id: wol_45d1348abb31509a8437
      kontekst: data.json:scripts.baronmanor_topiaryletter.invpopup
      linia: 1
      sekcja_skryptu: invpopup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'I''ve been told some of you are having trouble with my little mnemonic device, so here''s a clarification: Manor side is top, fence side is bottom. This seemed obvious to me but I can understand how it might be ambiguous.'
      pl: 'Powiedziano mi, że niektórzy z was mają kłopot z moim małym urządzeniem mnemotechnicznym, więc wyjaśniam: strona od posiadłości to góra, strona od płotu to dół. Wydawało mi się to oczywiste, ale rozumiem, że może być niejednoznaczne.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_495212b863ffaff8eb5b
      kontekst: data.json:scripts.baronmanor_topiaryletter.invpopup
      linia: 2
      sekcja_skryptu: invpopup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Also, and this I do not feel bad about: it''s just limbs! Not wings. Not pairs of limbs. Not limbs plus that weird sucky little mouth thing. Just use normal animal numbers of limbs, the way a child would! I made it SO EASY FOR YOU.'
      pl: Poza tym — i tego nie żałuję — to tylko kończyny! Nie skrzydła. Nie pary kończyn. Nie kończyny plus ta dziwna ssąca buźka. Po prostu normalna liczba kończyn jak u zwierzęcia, jak narysowałoby dziecko! Ułatwiłem wam to BARDZO.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_ab44b08c6784872b5fa6
      kontekst: data.json:scripts.baronmanor_topiaryletter.invpopup
      linia: 3
      sekcja_skryptu: invpopup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'One more thing: keep this note secret! If I find another one of these crumpled up and shoved into a topiary I will fire all of you. Not as in "terminate your employment" but as in "use you for a cannonball". --RB'
      pl: 'Jeszcze jedno: trzymajcie tę notkę w tajemnicy! Jeśli znajdę kolejną zmiętą i wypchniętą w topiar, zwolnię was wszystkich. Nie chodzi o „zakończenie zatrudnienia”, tylko o „użycie was jako kuli armatniej”. --RB'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
