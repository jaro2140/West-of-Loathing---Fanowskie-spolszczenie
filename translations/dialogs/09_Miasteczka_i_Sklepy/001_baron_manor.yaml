  - etykieta: first
    wpisy:
    - id: wol_6c7bd46696ec2a618b88
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.first
      linia: 3
      sekcja_skryptu: first
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: May 17, 1893
      pl: 17 maja 1893
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_176b5d4d5e929cb9d8a3
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.first
      linia: 4
      sekcja_skryptu: first
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: I am depressed to report that my ongoing agreement with the clowns now includes my attendance at some yearly ceremonial dinner. I <i>know</i> I'm going to <i>thoroughly</i> despise the whole ordeal, from having to make small talk with clowns to having to eat a five-course clown meal, but I need these chucklebumpkins and I have to be diplomatic.
      pl: Z przykrością donoszę, że moja trwająca umowa z klaunami obejmuje teraz mój udział w corocznej ceremonialnej kolacji. <i>Wiem</i>, że <i>całkowicie</i> wzgardzę całym tym cyrkiem — od pogawędek z klaunami po pięciodaniową klauniową kolację — ale potrzebuję tych chichotliwców i muszę być dyplomatyczny.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_198fc15eab78b3fcee44
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.first
      linia: 5
      sekcja_skryptu: first
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Will have to get a ridiculous suit fitted. Possibly a nose? Cowl's might have a book on clown attire for dinner parties, or I could just run naked through the zoo and wear whatever fur and feathers happen to cling to me. I'm sure no one would notice.
      pl: Trzeba będzie dopasować absurdalny garnitur. Może nos? Cowl's może mieć książkę o strojach klaunów na kolacje, albo mogę pobiec nago przez zoo i nosić, cokolwiek futra i pióra do mnie przykleją. Na pewno nikt nie zauważy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: opts
    wpisy:
    - id: wol_28b2fbc9c8dae75036cb
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.opts
      linia: 6
      sekcja_skryptu: opts
      typ: option
      mowca_lub_kanal: opcja_gracza
