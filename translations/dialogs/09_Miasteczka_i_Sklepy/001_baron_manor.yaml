      kontekst: data.json:scripts.baronmanor_secondentrance_guardinteraction.watch9
      linia: 2
      sekcja_skryptu: watch9
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, I know you, and I know about your whole oppositional defiance thing, and I remembered our boss's threat to murder us all if one of us shoved his memo into a topiary, which was <i>weirdly</i> specific...
      pl: Znam cię i wiem o twojej całej opozycyjności, i przypomniałem sobie groźbę naszego szefa, by nas wszystkich zamordować, jeśli jedno z nas wepchnie jego notatkę do strzyżonego krzewu, co było <i>dziwnie</i> specyficzne...
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
