      uwagi: []
  - etykieta: second
    wpisy:
    - id: wol_318465c189862d8deb23
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second
      linia: 7
      sekcja_skryptu: second
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: May 28, 1893
      pl: 28 maja 1893
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_1069b68ef878d3b7a142
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second
      linia: 8
      sekcja_skryptu: second
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Well, my first mandatory clown dinner turned out to be more diverting than I''d expected. I''d gone to see if there were any non-clown cocktails at the bar (result: could <i>not</i> tell) where I met a fellow who called himself Chortles and was several beverages ahead of me on the drinking-our-troubles-away timeline.'
      pl: 'No, moja pierwsza obowiązkowa kolacja z klaunami okazała się bardziej rozrywkowa, niż się spodziewałem. Poszedłem sprawdzić, czy w barze są drinki nie-klaunowe (wynik: <i>nie</i> dało się stwierdzić), gdzie spotkałem gościa, który nazywał się Chortles i był kilka napojów przede mną na osi picia-problemów.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_99bf7419daebd95b90b7
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second
      linia: 9
      sekcja_skryptu: second
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Chortles explained to me that his great tragedy in life was that, unlike all the other clowns, he just wasn't funny. This is how I learned that <i>clowns think they are funny,</i> which was quite the revelation after all these years!
      pl: Chortles wyjaśnił mi, że jego wielką tragedią w życiu było to, że w przeciwieństwie do innych klaunów po prostu nie był zabawny. Tak dowiedziałem się, że <i>klauny uważają się za zabawne,</i> co było całkiem odkrywcze po tylu latach!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_702ff4536ddfdc8c35db
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second
      linia: 10
      sekcja_skryptu: second
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Sensing an opportunity to amuse myself heavily, I asked him if he'd ever heard of puns.
      pl: Wyczuwając okazję do solidnej rozrywki, zapytałem go, czy słyszał o kalamburach.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7a82df8a66dad6db8afa
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second
      linia: 11
      sekcja_skryptu: second
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Turn the page
      pl: Przewróć stronę
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: second2
    wpisy:
    - id: wol_0b99eefabbb539ec9f73
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second2
      linia: 12
      sekcja_skryptu: second2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You turn the page and continue reading.
      pl: Przewracasz stronę i czytasz dalej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_82c792cfeaa2aa620f6c
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second2
      linia: 13
      sekcja_skryptu: second2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"Puns?" he asked. "I''ve heard of them, but they''re not really <i>funny</i>, are they?"'
      pl: '"Kalambury?” zapytał. „Słyszałem o nich, ale nie są chyba naprawdę <i>śmieszne</i>, prawda?”'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_1f1946bb497df0e77c2d
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second2
      linia: 14
      sekcja_skryptu: second2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"I assure you, my dear fellow," I assured him, "a good pun is an immediate shortcut to hilarity." Then, and this was brilliant of me, I pulled this entire speech out of my rectum about how pun energy resonated with the fractal nature of the universe, creating mathematically perfect comedy, something like that.'
      pl: '"Zapewniam cię, drogi przyjacielu,” zapewniłem go, „dobry żart słowny to natychmiastowa droga do rozbawienia.” Potem, i to było genialne z mojej strony, wyciągnąłem z tyłka całą tę mowę o tym, jak energia kalamburu rezonuje z fraktalną naturą wszechświata, tworząc matematycznie doskonałą komedię, coś w tym stylu.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_2af3343d007615b94a2f
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.second2
      linia: 15
      sekcja_skryptu: second2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He <i>actually bought it.</i> I watched him drink it all up, eyes wide (or that could have been the makeup, hard to tell with clowns). He's coming to visit me in my fake sitting room next week so I can give him <i>pun lessons</i>. Ha!
      pl: <i>Naprawdę to kupił.</i> Widziałem, jak wypił wszystko do ostatniej kropli, oczy szeroko otwarte (albo to makijaż, z klaunami ciężko powiedzieć). W przyszłym tygodniu odwiedzi mnie w moim fałszywym saloniku, żebym mógł dać mu <i>lekcje kalamburów</i>. Ha!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
