    - id: wol_d636dff890356239498d
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.third
      linia: 19
      sekcja_skryptu: third
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Okay, let's not mince words here, our friend Chortles is <i>terrible</i> at puns. What he lacks in ability, however, he makes up for in dedication to his studies. I'd be frightened by his intensity, if I were capable of experiencing fear as an emotion.
      pl: 'Okej, bez owijania w bawełnę: nasz przyjaciel Chortles jest <i>okropny</i> w kalamburach. Czego mu brakuje w talencie, nadrabia zaangażowaniem w naukę. Przeraziłby mnie jego zapał, gdybym był zdolny do odczuwania strachu jako emocji.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_bc44368a26b415f05392
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.third
      linia: 20
      sekcja_skryptu: third
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: For our first lesson I went over the most <i>basic</i> stuff with him, how sometimes words sound like other words, and to thank me he taught me what he claimed was a 'clown song of power.' No explanation why he, arguably the worst clown, would know such a thing, and I didn't ask.
      pl: Na pierwszej lekcji omawialiśmy z nim najbardziej <i>podstawowe</i> rzeczy — jak czasem słowa brzmią jak inne słowa — a w podzięce nauczył mnie tego, co twierdził, że jest „klaunową pieśnią mocy”. Bez wyjaśnienia, czemu akurat on, prawdopodobnie najgorszy klaun, zna coś takiego; nie pytałem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_17785eaf9ea15a6cfeed
      kontekst: data.json:scripts.baronmanor_bedroom_readdiary.third
      linia: 21
      sekcja_skryptu: third
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As for the song, and this is <i>wild</i>, it's just the notes EGG repeated four times. EGG EGG EGG EGG. Tried it on the piano and it did nothing except give me an idea for a new secret passage.
      pl: A co do piosenki — i to jest <i>szalone</i> — to po prostu nuty EGG powtórzone cztery razy. EGG EGG EGG EGG. Spróbowałem na pianinie i nic nie zrobiło, poza tym że dało mi pomysł na nowe tajne przejście.
      status: do_korekty
