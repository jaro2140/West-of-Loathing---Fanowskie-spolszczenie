      sekcja_skryptu: node3
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: If you know what sort of cactus to look for, they'll help you survive out in the desert for quite a while, too! They collect and store a lot of drinkable water, and several varieties bear edible fruit!
      pl: Jeśli wiesz, jakiego kaktusa szukać, pomogą ci też przetrwać na pustyni przez spory czas! Zbierają i magazynują dużo wody do picia, a kilka odmian ma jadalne owoce!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: opts
