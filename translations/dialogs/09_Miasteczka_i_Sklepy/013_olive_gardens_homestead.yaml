      linia: 22
      sekcja_skryptu: node6
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: You'll probably think I'm silly, but I kind of think of these cactuses as pets! They're like my big green prickly children! Though a lot easier to take care of, obviously.
      pl: Pewnie uznasz mnie za głupią, ale traktuję te kaktusy jak zwierzaki! Jak moje duże zielone kolczaste dzieci! Choć dużo łatwiejsze w opiece, oczywiście.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: node7
