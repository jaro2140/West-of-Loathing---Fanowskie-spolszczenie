      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: node4
    wpisy:
    - id: wol_ec30b5bc1e7c24e03437
      kontekst: data.json:scripts.olivegarden_convo.node4
      linia: 16
      sekcja_skryptu: node4
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: And that's even before we get into their medical uses! Did you know if you sterilize cactus spines over hot coals, you can use them for sutures? Although you have to be careful, because there's a couple breeds whose spines are actually venomous!
      pl: A to jeszcze przed zastosowaniami medycznymi! Wiesz, że jeśli wysterylizujesz kolce kaktusa nad gorącym węglem, możesz ich użyć do szwów? Trzeba uważać, bo kilka gatunków ma kolce faktycznie jadowite!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: opts
