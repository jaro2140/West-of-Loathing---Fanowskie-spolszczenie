      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Oh, I don't grow 'em to eat, I just grow 'em to grow 'em.  In fact, if you've got the knowhow, you're welcome to harvest anything you'd like.
      pl: O, nie uprawiam ich, żeby je jeść, uprawiam je po to, żeby je uprawiać. Właściwie, jeśli wiesz jak, możesz zebrać, co tylko chcesz.
