      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: People probably think of me as that weird cactus lady that lives outside of town, but that doesn't matter to me so long as I've got my needle-babies!
      pl: Ludzie pewnie myślą o mnie jak o tej dziwnej kaktusowej babie mieszkającej za miastem, ale to mnie nie obchodzi, dopóki mam swoje igiełkowe dzieciaczki!
