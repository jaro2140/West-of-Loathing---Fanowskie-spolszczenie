    - id: wol_873e5ddf115d1732eedf
      kontekst: data.json:scripts.olivegarden_convo.node5
      linia: 19
      sekcja_skryptu: node5
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Did you know that saguaro cactuses -- those are the tall ones with the arms, that you probably picture when you think about cactuses -- generally live to be 160 or 170 years old? Sometimes as old as 200 years! Heck, they aren't even considered adults until they're 125!
      pl: Wiesz, że kaktusy saguaro — te wysokie z ramionami, które pewnie widzisz przed oczami, gdy myślisz o kaktusach — żyją zwykle 160 albo 170 lat? Czasem nawet 200! Hej, dorosłe uznaje się je dopiero w wieku 125 lat!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: node6
