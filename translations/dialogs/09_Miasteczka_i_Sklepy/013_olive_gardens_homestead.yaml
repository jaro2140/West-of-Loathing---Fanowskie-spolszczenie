      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Sure thing, hon! Why, I'm always happy to meet another cactus aficionado! Did you know there's more than two thousand different breeds of cactus? All different shapes and sizes, and all different colors of flowers, too!
      pl: Jasna sprawa, kochanie! Zawsze cieszę się, gdy spotykam kolejnego miłośnika kaktusów! Wiesz, że jest ponad dwa tysiące odmian kaktusów? Wszystkie inne kształty i rozmiary, i wszystkie inne kolory kwiatów!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
