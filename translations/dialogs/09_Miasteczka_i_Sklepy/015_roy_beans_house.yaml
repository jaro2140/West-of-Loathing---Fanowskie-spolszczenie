      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: 'Well, when I first came to these parts, I was all about two things: dispensin'' justice, and dispensin'' jellybeans. I was the biggest name in bounty-huntin'' and candy-sellin'' anyone ever heard of.'
