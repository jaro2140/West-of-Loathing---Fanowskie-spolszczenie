      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, hello again! Thank you for telling me about this town, my friend, it's a marvelous location. That's two good turns you've done me!
      pl: Witam ponownie! Dziękuję, że opowiedziałeś mi o tym mieście, przyjacielu, to wspaniała lokalizacja. To już druga przysługa, jaką mi wyświadczyłeś!
