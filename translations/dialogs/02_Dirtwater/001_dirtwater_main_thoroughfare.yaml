      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: No, that's bad. Because it's only the <i>water</i> part of spit that evaporates. This brass bucket is half-full of the <i>rest</i> of the spit. The toxins and filth that don't evaporate. Several years' worth. Distilled and concentrated until it's the consistency of molasses. People aren't allowed to flick cigarette butts into the spittoon any more, because they bounce out.
      pl: Nie, i to źle. Bo z plwociny paruje tylko jej <i>wodna</i> część. To mosiężne wiadro jest do połowy pełne <i>reszty</i> plwociny. Toksyn i brudu, które nie parują. Uzbierało się tego kilka lat. Destylowane i zagęszczane, aż osiągnęło konsystencję melasy. Nie wolno już strzelać niedopałkami do spluwaczki, bo się odbijają.
