    - id: wol_90176880d44aed93ceca
      kontekst: data.json:scripts.dirtwater_murray.neighbor
      linia: 27
      sekcja_skryptu: neighbor
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: The very same day a hot dog salesman moved in next door to me, I came into possession of an ancient ring with mysterious meat-detection powers!
      pl: Dokładnie tego samego dnia, gdy obok mnie zamieszkał sprzedawca hot dogów, wszedłem w posiadanie starożytnego pierścienia o tajemniczej mocy wykrywania mięsa!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_cf64e352c08778b3950d
      kontekst: data.json:scripts.dirtwater_murray.neighbor
      linia: 28
      sekcja_skryptu: neighbor
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: You noticed the tanner that moved in next door to me? Well, the same day he arrived, I acquired a spool of magic-amplifying thread. If you were to embroider some pants with it, the results could be quite powerful!
      pl: Zauważyłeś garbarza, który wprowadził się obok mnie? Tego samego dnia, kiedy przybył, zdobyłem szpulę magicznowzmacniającej nici. Jeśli haftowałbyś nią spodnie, wyniki mogłyby być dość mocne!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_5cdef882ac378834044a
      kontekst: data.json:scripts.dirtwater_murray.neighbor
      linia: 29
      sekcja_skryptu: neighbor
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Have you met the bootmaker next door? I wasn't inclined to believe his stories about elves, but this morning I found a very interesting little hat on my doorstep, where my milk delivery was supposed to be!
      pl: Poznałeś szewca z sąsiedztwa? Nie chciałem wierzyć w jego historie o elfach, ale dziś rano znalazłem na progu bardzo ciekawy mały kapelusz, dokładnie tam, gdzie miała czekać dostawa mleka!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7545f1dfc0aff1ae8281
      kontekst: data.json:scripts.dirtwater_murray.neighbor
      linia: 30
      sekcja_skryptu: neighbor
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Have you met the charming young lady who runs the bookshop next door? The very day she moved in, I received a package from a contact of mine -- a mysterious painting!
      pl: Poznałeś uroczą młodą damę prowadzącą księgarnię obok? Dokładnie w dniu jej przeprowadzki dostałem przesyłkę od mojego kontaktu — tajemniczy obraz!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_ad6c07b08e8b4f3ce52a
      kontekst: data.json:scripts.dirtwater_murray.neighbor
      linia: 31
      sekcja_skryptu: neighbor
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I've been working for several years on constructing a magical artifact of my own devising, and the same day the brewer moved in next door, I finally hit on the inspiration I required to finish it! It didn't even take very many bottles!
      pl: Od kilku lat pracuję nad skonstruowaniem magicznego artefaktu własnego pomysłu — i tego samego dnia, gdy obok wprowadził się piwowar, wreszcie znalazłem natchnienie potrzebne, by go ukończyć! Nie trzeba było nawet zbyt wielu butelek!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
