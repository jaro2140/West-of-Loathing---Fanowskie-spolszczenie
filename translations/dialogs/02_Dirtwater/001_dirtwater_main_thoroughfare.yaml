      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: All right, fine. You are now hunkered down next to a brass filth-bucket, which has probably never been cleaned or emptied because you're near the desert and the ambient humidity around here is pretty low -- low enough that the spit evaporates nearly as quickly as it accumulates.
