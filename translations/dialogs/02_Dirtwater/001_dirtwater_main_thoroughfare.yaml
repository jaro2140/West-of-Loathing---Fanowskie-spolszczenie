      en: Look, the Jewel Saloon is pretty nice as saloons go -- actual glass in the windows, more than two kinds of drinks, a poker room instead of a cockfighting pit -- but this spittoon is still a spittoon. The rancid tobacco spit inside it isn't <i>fancy</i> rancid tobacco spit.
