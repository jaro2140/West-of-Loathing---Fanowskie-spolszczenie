      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You notice that the door jamb is busted, probably from being kicked in.  There's a crude hasp made of bent nails on the door -- looks like the bandits have just been locking it with a padlock from the outside when they leave.
