      kontekst: data.json:scripts.bandit5_vlassrevisit.node10
      linia: 12
      sekcja_skryptu: node10
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Break's over! Second shift! You, get over to the salt tank! <i>NOW!</i>
      pl: Koniec przerwy! Druga zmiana! Ty, do zbiornika z solą! <i>JUŻ!</i>
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
