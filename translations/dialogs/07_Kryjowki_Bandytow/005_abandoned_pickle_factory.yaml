  - etykieta: node11
    wpisy:
    - id: wol_3c8d17f907e3e980e322
      kontekst: data.json:scripts.bandit5_vlassrevisit.node11
      linia: 14
      sekcja_skryptu: node11
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Managing the salt tank isn't as strenuous as the pickle hoppers, but it's still a neverending tension. The brine concentration has to be constantly monitored and kept at a very specific measurement, which means constant adjustments. Meanwhile, you can feel yourself desiccating from the haze of salt dust that fills the room.
      pl: Obsługa zbiornika soli nie jest tak wyczerpująca jak skakanie po ogórkach, ale to nieustanna nerwica. Stężenie solanki trzeba non stop monitorować i utrzymywać na bardzo konkretnym poziomie, co oznacza ciągłe korekty. Tymczasem czujesz, jak wysychasz od mgły solnej kurzu wypełniającej pomieszczenie.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
