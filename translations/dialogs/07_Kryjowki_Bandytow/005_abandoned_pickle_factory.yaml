      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You get another 180-second break before third shift. You spend most of it drinking water. The company doesn't charge for water, but you've heard a rumor they're considering it.
      pl: Masz kolejną 180-sekundową przerwę przed trzecią zmianą. Większość spędzasz na piciu wody. Firma nie bierze za wodę, ale słyszałeś plotkę, że rozważają to wprowadzenie.
