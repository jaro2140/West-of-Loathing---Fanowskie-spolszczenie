  - etykieta: node2
    wpisy:
    - id: wol_b18f2770de1dae406dfa
      kontekst: data.json:scripts.bandit5_vlassrevisit.node2
      linia: 3
      sekcja_skryptu: node2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Oh no, you're late for your shift! Mrs. Vlass is gonna be <i>so mad!</i> She might literally bite your head off! Okay, well, not <i>literally</i> literally. Probably.
      pl: O nie, spóźniłeś się na zmianę! Pani Vlass będzie <i>wściekła!</i> Może ci dosłownie odgryźć głowę! No, właściwie to nie <i>dosłownie</i> dosłownie. Chyba.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne:
      - <i>
      - </i>
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_87872a48a003518a2ed6
      kontekst: data.json:scripts.bandit5_vlassrevisit.node2
      linia: 4
      sekcja_skryptu: node2
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Quick! Get suited up!
      pl: Szybko! Ubieraj się!
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: node3
    wpisy:
    - id: wol_8ef2fcfb3c158afb9cf2
      kontekst: data.json:scripts.bandit5_vlassrevisit.node3
      linia: 5
      sekcja_skryptu: node3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You clock in and hurriedly put on your bright green coveralls. Mrs. Vlass, as predicted, is furious.
      pl: Odbijasz kartę i w pośpiechu zakładasz jaskrawozielony kombinezon. Pani Vlass, jak przewidywano, jest wściekła.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_ac8f293b21fbed7b95dd
      kontekst: data.json:scripts.bandit5_vlassrevisit.node3
      linia: 6
      sekcja_skryptu: node3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Late again?! You'd better stop taking this job for granted! You think you're gonna find a place with a nice dormitory and a reasonably-priced company store like ours somewhere else? With <i>your</i> skills? Hah! You're doing three shifts today, buster! Get to work, you're on pickle hopper duty!
      pl: Znowu się spóźniłeś?! Lepiej przestań uważać tę pracę za coś oczywistego! Myślisz, że gdzie indziej znajdziesz miejsce z porządnym dormitorium i sklepem firmowym w rozsądnych cenach, takim jak nasz? Z <i>twoimi</i> umiejętnościami? Ha! Dzisiaj pracujesz trzy zmiany, kolego! Do roboty, masz służbę przy lejach z ogórkami!
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_a3f573e8f6bbe4433d17
      kontekst: data.json:scripts.bandit5_vlassrevisit.node3
      linia: 7
      sekcja_skryptu: node3
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Start your shift
      pl: Rozpocznij zmianę
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: node4
    wpisy:
    - id: wol_a416b4e6481110036de0
      kontekst: data.json:scripts.bandit5_vlassrevisit.node4
      linia: 8
      sekcja_skryptu: node4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Pickle hopper duty runs you ragged, like always. Keeping the hoppers filled to keep a constant flow down the chutes means you're constantly at a near-sprint, because you have to manage the cuke shunts to keep the levels equal.
      pl: Służba przy lejach z ogórkami wyczerpuje cię jak zawsze. Żeby utrzymać stały przepływ w rynnach, musisz non stop zapełniać leje — biegniesz prawie sprintem, bo trzeba sterować przekierowaniami ogórków, żeby poziomy się zgadzały.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_ce428ac9bae8315bad5a
      kontekst: data.json:scripts.bandit5_vlassrevisit.node4
      linia: 9
      sekcja_skryptu: node4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: If you get uneven pickle levels, Mrs. Vlass knows. Nobody knows <i>how</i> she knows, but she knows. A whack from her cane is the minimum you'll get.
      pl: Jeśli poziomy ogórków wychodzą nierówne, pani Vlass wie. Nikt nie wie, <i>jak</i> wie, ale wie. Uderzenie laską to minimum, co dostaniesz.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_d17f32a626624ffee175
      kontekst: data.json:scripts.bandit5_vlassrevisit.node4
      linia: 10
      sekcja_skryptu: node4
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Dammit dammit dammit
      pl: Cholera cholera cholera
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: node10
    wpisy:
    - id: wol_24b8df4e6bca2b4bac4b
      kontekst: data.json:scripts.bandit5_vlassrevisit.node10
      linia: 11
      sekcja_skryptu: node10
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: At the end of the first six-hour shift, you get a brief break. You cram a stale cheese sandwich into your mouth while Mrs. Vlass glares at her pocketwatch, counting down three minutes to the second.
      pl: Pod koniec pierwszej sześciogodzinnej zmiany dostajesz krótką przerwę. Wpychasz w usta czerstwą kanapkę z serem, podczas gdy pani Vlass wpatruje się w kieszonkowy zegarek, odliczając trzy minuty co do sekundy.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
