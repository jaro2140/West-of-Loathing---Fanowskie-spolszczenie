    - id: wol_5e65ae31e4dc7890aa27
      kontekst: data.json:scripts.bandit5_vlassrevisit.node11
      linia: 16
      sekcja_skryptu: node11
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Cough!
      pl: Kaszl!
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
