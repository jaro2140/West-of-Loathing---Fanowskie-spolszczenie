      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Cough on your own time! And get that salinity back to normal! It's supposed to be nine hundred and seventy-six parts per thousand! How hard is that to remember? Nine hundred seventy-six! Idiot!
      pl: Kasłaj we własnym czasie! I przywróć zasolenie do normy! Ma wynosić dziewięćset siedemdziesiąt sześć części na tysiąc! Jak trudno to zapamiętać? Dziewięćset siedemdziesiąt sześć! Idioto!
