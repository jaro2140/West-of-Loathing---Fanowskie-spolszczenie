      kontekst: data.json:scripts.bandit5_vlassrevisit.node11
      linia: 15
      sekcja_skryptu: node11
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: If anything in this place kills you, it's probably gonna be salt tank duty. White lung is nasty business.
      pl: Jeśli cokolwiek w tym miejscu cię zabije, to pewnie będzie to służba przy zbiorniku z solanką. Białe płuca to brudna robota.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
