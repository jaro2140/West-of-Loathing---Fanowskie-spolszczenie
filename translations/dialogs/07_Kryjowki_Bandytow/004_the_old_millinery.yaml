      minigra_lub_feature: false
      uwagi: []
    - id: wol_5e5bc3bc5f6b3ad29144
      kontekst: data.json:scripts.bandit4_intro.two
      linia: 6
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bandits all jump up and scuttle back into their rooms.
      pl: Bandyci wszyscy podskakują i wpadają z powrotem do swoich pokoi.
