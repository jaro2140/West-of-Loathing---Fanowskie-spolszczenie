  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_390d1cdec408617a14f8
      kontekst: data.json:scripts.bandit4_intro.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You walk into the millinery and find five bandits lounging around on big piles of half-made hats.
      pl: Wchodzisz do modniarni i znajdujesz pięciu bandytów leniuchujących na stosach półgotowych kapeluszy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_2a4703a5b327d6b497ee
      kontekst: data.json:scripts.bandit4_intro.start
      linia: 2
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It's the law! Skedaddle!
      pl: Takie jest prawo! Zmykaj!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_772b423f71ea74178c80
      kontekst: data.json:scripts.bandit4_intro.start
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bandits scatter like cockroaches, each shutting themself behind a different door. Guess you'll have to wrangle them individually.
      pl: Bandyci rozpraszają się jak karaluchy, każdy zamykając się za innymi drzwiami. Chyba będziesz musiał ich ogarnąć pojedynczo.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_6406b86b6d0a3fe59bf6
      kontekst: data.json:scripts.bandit4_intro.start
      linia: 4
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Fine.
      pl: Dobrze.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 4
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
