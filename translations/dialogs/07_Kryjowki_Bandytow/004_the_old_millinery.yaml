- kolejnosc_w_danych_gry: 92
  skrypt: bandit4_dumping
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 4
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_c7e1cbd735761ce0160c
      kontekst: data.json:scripts.bandit4_dumping.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bandit unceremoniously dumps you outside, and walks back in making that "dusting off their hands" gesture like in a cartoon.
      pl: Bandyta bez ceremonii wyrzuca cię na zewnątrz i wraca do środka, robiąc gest „otrząsania rąk” jak w kreskówce.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_f8bbdbf5068d942d8ae3
      kontekst: data.json:scripts.bandit4_dumping.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bandit unceremoniously dumps you outside, and unties their friend. The two of them make rude hand gestures at you as they head back inside.
      pl: Bandyta bez ceremonii wyrzuca cię na zewnątrz i rozwiązuje swojego przyjaciela. Obaj robią ci niegrzeczne gesty, wracając do środka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_9e855afa1bfe65a3c4c5
      kontekst: data.json:scripts.bandit4_dumping.start
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bandit unceremoniously dumps you outside, and unties their friends. The friends take the opportunity to get a couple kicks in on you before they all go back inside.
      pl: Bandyta bez ceremonii wyrzuca cię na zewnątrz i rozwiązuje swoich przyjaciół. Przyjaciele korzystają z okazji, by kopnąć cię parę razy, zanim wszyscy wrócą do środka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_22d3257878e2569f437f
      kontekst: data.json:scripts.bandit4_dumping.start
      linia: 4
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Bah.
      pl: Phi.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 5
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
- kolejnosc_w_danych_gry: 94
  skrypt: bandit4_intro
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
