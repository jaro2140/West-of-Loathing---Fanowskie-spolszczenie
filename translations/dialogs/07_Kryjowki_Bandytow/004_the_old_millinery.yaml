      kontekst: data.json:scripts.bandit4_intro.two
      linia: 5
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh no! @He@'s back!
      pl: O nie, znowu tu jest!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '@He@'
