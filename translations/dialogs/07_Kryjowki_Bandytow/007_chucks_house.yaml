    - id: wol_8502ce440a9eb3fe08fb
      kontekst: data.json:scripts.bandit8_intro.mailman
      linia: 7
      sekcja_skryptu: mailman
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yeah, I've been stressed out lately, so I took a day off and rented a room here for a sort of mini-vacation. Chuck's a great guy -- a little weird I guess, but real personable. And his cooking is great! The tomato soup, and those great big sausages... his tea did wonders for my insomnia, too.
      pl: Ostatnio byłem zestresowany, więc wziąłem dzień wolnego i wynająłem tu pokój na miniwakacje. Chuck to świetny facet, trochę dziwny, ale bardzo sympatyczny. A jego gotowanie jest świetne! Zupa pomidorowa, i te wielkie kiełbaski... Jego herbata zrobiła cuda także dla mojej bezsenności.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
