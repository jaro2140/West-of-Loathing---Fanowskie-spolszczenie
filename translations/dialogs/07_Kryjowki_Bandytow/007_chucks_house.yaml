    - id: wol_78d95adfd9f58762026c
      kontekst: data.json:scripts.bandit8_intro.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Hmm. Something about this house makes you suspicious. You can't quite put your finger on it -- the place <i>looks</i> perfectly normal, after all -- but you can't shake the feeling that there's something very wrong going on here.
      pl: Hmm. Coś w tym domu budzi twoje podejrzenia. Nie potrafisz tego uchwycić — w końcu miejsce <i>wygląda</i> całkiem normalnie — ale nie możesz pozbyć się wrażenia, że dzieje się tu coś bardzo nie tak.
