      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: It did seem pretty effective.
      pl: Wyglądało na całkiem skuteczne.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
