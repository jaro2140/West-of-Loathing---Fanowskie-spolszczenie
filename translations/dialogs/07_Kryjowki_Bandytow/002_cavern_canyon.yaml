      linia: 9
      sekcja_skryptu: conv1
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: That's my name too!  How d'ya do, fellow Doug?
      pl: To też moje imię! Jak leci, kolego Doug?
