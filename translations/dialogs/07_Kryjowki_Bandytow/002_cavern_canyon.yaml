    - id: wol_e294e6c357fb04292998
      kontekst: data.json:scripts.bandit2_captivecook.conv1
      linia: 10
      sekcja_skryptu: conv1
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Well, I've been chained up in this dank cave for weeks, cooking for those stripey-hatted idiots.
      pl: No, od tygodni jestem przykuty w tej wilgotnej jaskini i gotuję dla tych idiotów w pasiastych kapeluszach.
