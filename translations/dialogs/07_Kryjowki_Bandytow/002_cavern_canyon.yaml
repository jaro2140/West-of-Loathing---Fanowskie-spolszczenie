      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_d31fd34265efdd008b3b
      kontekst: data.json:scripts.bandit2_captivecook.conv1
      linia: 11
      sekcja_skryptu: conv1
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: That sounds awful!
      pl: To brzmi okropnie!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
  - etykieta: conv2
