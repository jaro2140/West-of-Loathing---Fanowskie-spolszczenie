    - id: wol_7380d886e95577003d60
      kontekst: data.json:scripts.bandit2_captivecook.conv3
      linia: 17
      sekcja_skryptu: conv3
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: Ah.  That's rough.
      pl: Ach. Ciężko.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_c6130c818f3c24d0a939
      kontekst: data.json:scripts.bandit2_captivecook.conv3
      linia: 18
      sekcja_skryptu: conv3
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: I know, right?  There I was, fresh out of culinary school with a million Meat idea in my head, and now here I am, four feet shy of my dreams, cooking the same pot of soup over and over again.
      pl: No co, prawda? A tu ja, świeżo po szkole kulinarnej z milionem pomysłów na Mięso w głowie, a teraz stoję o cztery stopy poniżej moich marzeń i gotuję tę samą zupę w kółko.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_8facd652a74201c706d3
      kontekst: data.json:scripts.bandit2_captivecook.conv3
      linia: 19
      sekcja_skryptu: conv3
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: What million Meat idea?
      pl: Jaki pomysł na milion Mięsa?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
  - etykieta: conv4
