    - id: wol_ac0d33aa631417cd812e
      kontekst: data.json:scripts.bandit2_captivecook.conv3
      linia: 16
      sekcja_skryptu: conv3
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: This chain is only four feet long!
      pl: Łańcuch ma tylko cztery stopy!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
