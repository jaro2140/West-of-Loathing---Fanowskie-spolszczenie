  - etykieta: conv5a2
    wpisy:
    - id: wol_e227730d567c66d45ea9
      kontekst: data.json:scripts.bandit2_captivecook.conv5a2
      linia: 24
      sekcja_skryptu: conv5a2
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Okay then.  It's a new kind of sandwich.  Or maybe a taco.  It's so revolutionary that I'm not quite sure where it fits in the whole hand-food taxonomy, to be honest.
      pl: No to dobra. To nowy rodzaj kanapki. Albo może taco. Jest tak rewolucyjne, że szczerze mówiąc nie jestem pewien, gdzie pasuje w całej taksonomii jedzenia do ręki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_0eb9c308a8b37dbc05dc
      kontekst: data.json:scripts.bandit2_captivecook.conv5a2
      linia: 25
      sekcja_skryptu: conv5a2
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Anyway.  In the middle of it there's a sausage, but it's sausage made from the cheapest possible parts of a pig, ground up so finely that you can't identify them anymore.
