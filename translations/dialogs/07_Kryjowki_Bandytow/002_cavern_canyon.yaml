      kontekst: data.json:scripts.bandit2_captivecook.conv1
      linia: 8
      sekcja_skryptu: conv1
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: '@firstname@.  How d''ya do, Doug?'
      pl: '@firstname@. Jak tam, Doug?'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
