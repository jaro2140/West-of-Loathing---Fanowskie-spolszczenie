    - id: wol_408614db60b47153942c
      kontekst: data.json:scripts.bandit2_captivecook.conv2
      linia: 13
      sekcja_skryptu: conv2
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: You wanna know the worst part?  There's a perfectly good oven eight feet to my right, and a shelf of perfectly good ingredients eight feet to my left.
      pl: Chcesz wiedzieć, co najgorsze? Jest idealny piekarnik osiem stóp po mojej prawej i półka idealnych składników osiem stóp po lewej.
