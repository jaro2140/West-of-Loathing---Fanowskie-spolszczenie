    - id: wol_890f9292141eb42dd153
      kontekst: data.json:scripts.railcamp_dynamitejim.talktoboss2
      linia: 23
      sekcja_skryptu: talktoboss2
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Then I'd say that paper-backed idiot over there in the absurd white hat is the fella you're looking for.
      pl: To powiedziałbym, że tamten pozbawiony kręgosłupa idiota w absurdalnym białym kapeluszu to gość, którego szukasz.
