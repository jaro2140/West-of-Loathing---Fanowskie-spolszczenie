      en: You crack your knuckles, take a deep breath, and aim your strongest haymaker at the rock monster. Your punch blows open a fracture caused by the dynamite, and cascading faultlines criss-cross the creature's surface. With a roar of anger and pain, it explodes into fine gravel.
