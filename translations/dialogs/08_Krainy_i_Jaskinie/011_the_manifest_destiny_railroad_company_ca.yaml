  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_04143fc47aa411fa57b4
      kontekst: data.json:scripts.railcamp_dynamitejim.start
      linia: 1
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What's the situation?
      pl: Jaka jest sytuacja?
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_763262f18dc5e7958ded
      kontekst: data.json:scripts.railcamp_dynamitejim.start
      linia: 2
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, I'm sure you didn't miss seeing this giant pile of rocks blocking our path. The surveyors say there isn't any other suitable mountain pass, so we can't reroute around it even if we had the months it'd take.
      pl: Jestem pewien, że nie przegapiłeś widoku tej ogromnej sterty skał, która blokuje nam drogę. Geodeci mówią, że nie ma żadnej innej odpowiedniej przepustki, więc nie możemy jej zmienić, nawet gdybyśmy mieli tyle miesięcy, ile potrzeba.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7f3d0a359a7e25702fb4
      kontekst: data.json:scripts.railcamp_dynamitejim.start
      linia: 4
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, by my calculations, we could dynamite it clear without too much trouble. Problem is, it'll take a lot of dynamite. A whole year's worth, I figure. We used to keep that much on hand, for emergencies just such as this one, but a pack of goblins stole it all. Sneaky little varmints.
      pl: Z moich obliczeń wynika, że możemy to zrobić bez większych problemów. Problem w tym, że potrzeba dużo dynamitu. Myślę, że cały rok. Trzymaliśmy tyle pod ręką, na wypadek takiej sytuacji, jak ta, ale paczka goblinów ukradła wszystko. Podstępne małe robaczki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_9b5fa07c56d31c75d041
      kontekst: data.json:scripts.railcamp_dynamitejim.start
      linia: 5
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: All right, I'll get it back for you.
      pl: Dobra, odzyskam to dla ciebie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: doit
    wpisy:
    - id: wol_35ec6706ea9c4fb293df
      kontekst: data.json:scripts.railcamp_dynamitejim.doit
      linia: 7
      sekcja_skryptu: doit
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Glad to hear it. The goblins are holed up over in Gustavson Gulch. It's a real rough place -- you might want to spend some time getting the lay of the land and honing your fighting skills before you head that way. Especially if you plan to go in guns blazing.
      pl: Cieszę się, że to słyszę. Gobliny zaszyły się w Wąwozie Gustavsona. To naprawdę paskudne miejsce — zanim tam ruszysz, może warto rozeznać się w okolicy i podszlifować umiejętności bojowe. Zwłaszcza jeśli zamierzasz wejść z hukiem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_ba604f4b9ca7922e5f5c
      kontekst: data.json:scripts.railcamp_dynamitejim.doit
      linia: 8
      sekcja_skryptu: doit
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: We don't need that specific dynamite, though. Any you can lay your hands on'd be fine, so long as there's enough of it.
      pl: Nie potrzebujemy akurat tego dynamitu. Każdy, jaki uda ci się zdobyć, będzie w porządku, o ile wystarczy go pod dostatkiem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_28b0511afef81a0b5b6a
      kontekst: data.json:scripts.railcamp_dynamitejim.doit
      linia: 9
      sekcja_skryptu: doit
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: I'll look into it.
      pl: Sprawdzę to.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: nope
    wpisy:
    - id: wol_9948500ba1999ad09de6
      kontekst: data.json:scripts.railcamp_dynamitejim.nope
      linia: 12
      sekcja_skryptu: nope
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: 'Not interested in helping? Some foreman you turned out to be. I''ll tell you this for nothing, though: if you''re looking to get any further west, you won''t be doing it without this train. Like I said, there''s only one pass through the mountains.'
      pl: 'Nie chcesz pomóc? Co z ciebie za brygadzista. Jedno powiem ci za darmo: jeśli chcesz ruszyć dalej na zachód, bez tego pociągu ci się nie uda. Jak mówiłem, przez góry prowadzi tylko jedna przełęcz.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_51d8d30b86953a1c73b9
      kontekst: data.json:scripts.railcamp_dynamitejim.nope
      linia: 13
      sekcja_skryptu: nope
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: '...Nuts.'
      pl: '...Cholera.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_e9bd42fad9d88acd92b5
      kontekst: data.json:scripts.railcamp_dynamitejim.nope
      linia: 15
      sekcja_skryptu: nope
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Fine, I'll help.
      pl: No dobra, pomogę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: talktoboss
    wpisy:
    - id: wol_85894145c06c39269497
      kontekst: data.json:scripts.railcamp_dynamitejim.talktoboss
      linia: 16
      sekcja_skryptu: talktoboss
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You approach the beleaguered-looking man with the tiny glasses.
      pl: Podchodzisz do nieszczęśliwie wyglądającego mężczyzny w malutkich okularach.
