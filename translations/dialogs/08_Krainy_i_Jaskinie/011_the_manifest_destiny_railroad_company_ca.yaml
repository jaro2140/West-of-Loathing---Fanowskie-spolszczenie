    - id: wol_444e6a9b843e85da4543
      kontekst: data.json:scripts.railcamp_dynamitejim.talktoboss
      linia: 18
      sekcja_skryptu: talktoboss
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: If I'm being charitable, I'd say that the fella over there in the white hat is the foreman.
      pl: Jeśli mam być łaskawy, powiedziałbym, że gość tam w białym kapeluszu to brygadzista.
