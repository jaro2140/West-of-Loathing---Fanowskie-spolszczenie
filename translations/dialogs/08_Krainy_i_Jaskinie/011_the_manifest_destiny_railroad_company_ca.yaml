      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You still your breathing and squint until you can make out the rock monster's aura. As you expected, there is a web of cracks and faults in it, where the creature's energy was disrupted by the force of the dynamite. You point your finger at the weakest part of the damage and channel a little magic into it.
