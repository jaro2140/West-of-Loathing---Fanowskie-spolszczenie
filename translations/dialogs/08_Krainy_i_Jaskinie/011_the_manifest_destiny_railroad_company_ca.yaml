      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Smee consults with the other workers and they inspect the rocks for a time. Eventually one of them shrugs, pushes the whole crate of dynamite up next to the rocks, and wires up a detonator.
      pl: Smee konsultuje się z innymi robotnikami i przez chwilę oglądają skały. W końcu jeden wzrusza ramionami, podstawia całą skrzynię dynamitu przy skałach i podpina detonator.
