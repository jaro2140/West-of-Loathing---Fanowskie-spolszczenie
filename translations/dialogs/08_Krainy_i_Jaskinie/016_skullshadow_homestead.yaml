      en: 'He snapped his fingers and suddenly there were two demon lawyers standing on Ducky''s front porch in Portalhand, which was probably the fifth weirdest thing that''d happened down our street that evening. "My terms are the same: you leave the West by noon today and go <i>anywhere</i> else," Marty said. "What are your terms?"'
