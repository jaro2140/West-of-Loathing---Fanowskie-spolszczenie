      pl: '"Chcę dożywotniej gwarancji bezpieczeństwa dla każdego z tej listy, którą mi dałeś," powiedziałam. "Nie zabijasz ich, nie krzywdzisz ich, nie strącasz im nawet szklanki mleka, które piją. Nawet jeśli pojawią się pod twoimi drzwiami i spróbują cię zaatakować armią robotów."'
