      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: You should ask her sometime. She tells it better than I do. Anyway, we met, hit it off, and I moved into her house in Portalhand. Story starts about five years later, with us about as happy as people can be when they share living quarters. She was getting her machine-people business off the ground, and it was <i>incredible</i> watching her crochet all this stuff outta nothing. Sure, I kept finding gears in my soup, but I thought she was <i>brilliant</i> and I couldn't have been prouder.
      pl: Powinieneś ją kiedyś zapytać. Ona mówi to lepiej niż ja. W każdym razie, spotkałyśmy się, dogadałyśmy się i wprowadziłam się do jej domu w Portalhand. Historia zaczyna się pięć lat później, a my jesteśmy tak szczęśliwe, jak ludzie, kiedy dzielą mieszkanie. Rozkręcała swój biznes budowania ludzi-maszyn, i to było niesamowite <i>patrzeć, jak</i> szydełkuje te wszystkie rzeczy z niczego. Pewnie, wciąż znajdowałam tryby w zupie, ale myślałam, że <i>jest genialna</i> i nie mogłam być bardziej dumna.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
