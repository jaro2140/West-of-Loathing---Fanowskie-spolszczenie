      en: Yeah. Well. Maybe it was the wrong choice, but it's the one I made. I didn't go back in the house. Instead I dragged Lucky out to the entrance of our favorite riding trail -- woods came right up to the backyard in those days -- and buried him in a patch of those little white and purple flowers he loved to eat even though they gave him <i>horrible</i> gas. Sun was coming up over the mountains when I finished. Only had a few hours to get out of Dodge.
