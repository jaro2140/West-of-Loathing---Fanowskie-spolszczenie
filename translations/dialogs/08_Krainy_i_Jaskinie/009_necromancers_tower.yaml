      linia: 2
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Damn you. God<i>damn</i> you!
      pl: Przeklinam cię. Niech cię szlag <i>trafi!</i>
