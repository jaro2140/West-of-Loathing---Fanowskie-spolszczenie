    - id: wol_a76a5d4a7a675d991627
      kontekst: data.json:scripts.necrotower_alicebecome.start
      linia: 3
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Doc, don't worry about it. It's fine. Everything's wonderf--
      pl: Doktor, nie przejmuj się. Wszystko gra. Jest cudow—
