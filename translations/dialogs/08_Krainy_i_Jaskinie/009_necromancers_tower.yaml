      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_95a705a53359abf4ff8e
      kontekst: data.json:scripts.necrotower_alicebecome.two
      linia: 9
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bore of the shotgun vibrates from the trembling in Doc Alice's hands. Long slow seconds tick away.
      pl: Lufa strzelby drży od drżenia rąk Doc Alice. Długie, powolne sekundy tykają.
