      minigra_lub_feature: false
      uwagi: []
    - id: wol_267d971d2e096ce55788
      kontekst: data.json:scripts.necrotower_alicebecome.two
      linia: 10
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: '...I better never see your face again.'
