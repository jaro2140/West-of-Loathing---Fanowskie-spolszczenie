      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: <i>Relax</i>. I'm fully in control of my powers, and I promise only to use them for good.
      pl: <i>Spokojnie.</i> W pełni panuję nad swoimi mocami i obiecuję używać ich wyłącznie w dobrym celu.
