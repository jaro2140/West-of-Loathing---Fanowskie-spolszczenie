      linia: 8
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: <i>sigh</i> ...Alice, are you gonna shoot me or not?
      pl: <i>westchnienie</i> ...Alice, zastrzelisz mnie czy nie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
