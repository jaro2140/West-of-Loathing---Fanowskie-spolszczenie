      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_44811b76f640e5ccbb8f
      kontekst: data.json:scripts.necrotower_alicebecome.start
      linia: 4
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Don't you say another word. I trusted you, dammit! I came all this way because you said you'd help put an <i>end</i> to this, and what do you do? You just spit in my face! ...Was this your plan from the beginning?
      pl: Ani słowa więcej. Ufałam ci, do cholery! Przebyłam całą tę drogę, bo obiecałeś pomóc położyć temu <i>kres</i>, a co robisz? Plujesz mi prosto w twarz! ...Taki był twój plan od samego początku?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7e635320c9cc4fa710e1
      kontekst: data.json:scripts.necrotower_alicebecome.start
      linia: 5
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
