      kontekst: data.json:scripts.railcamp2_usetelescope.start
      linia: 6
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Conjure a bone bridge [Necromancy, Bones]
      pl: Przywołaj most z kości [Nekromancja, Kości]
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '[Necromancy, Bones]'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: bonedeploy
    wpisy:
    - id: wol_33db51a8de71f6d5ff48
      kontekst: data.json:scripts.railcamp2_usetelescope.bonedeploy
      linia: 7
      sekcja_skryptu: bonedeploy
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Your eyes glow black as you shout names that are also instructions.  After a few minutes, an army of skeletons arrives. Silent but for the xylophone-like clatter of bone against bone, the skeletons disassemble each other and constuct a bridge spanning the chasm. It takes only a half-hour or so before the last skeleton has slotted itself into place and the unnatural lights in all of the skulls' eye sockets fade out.
      pl: Twoje oczy świecą na czarno, gdy wykrzykujesz imiona, które są też instrukcjami. Po kilku minutach dociera armia szkieletów. Cicho, poza ksylofonowym brzękiem kości o kości, szkielety rozmontowują się nawzajem i budują most nad przepaścią. Zajmuje to zaledwie pół godziny, zanim ostatni szkielet wskoczy na miejsce, a nienaturalne światła we wszystkich oczodołach zgasną.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_a261362d10e4defd18b4
      kontekst: data.json:scripts.railcamp2_usetelescope.bonedeploy
      linia: 8
      sekcja_skryptu: bonedeploy
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Muahahahaaa
      pl: Buahahahaaa
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: start
    wpisy:
    - id: wol_27885de1b14646dac178
      kontekst: data.json:scripts.railcamp2_usetelescope.start
      linia: 9
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Activate the model [El Vibrato model bridge]
      pl: Uruchom model [Most modelowy El Vibrato]
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '[El Vibrato model bridge]'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: elvdeploy
    wpisy:
    - id: wol_68cced9080759e61cd62
      kontekst: data.json:scripts.railcamp2_usetelescope.elvdeploy
      linia: 10
      sekcja_skryptu: elvdeploy
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You twiddle the model until it bleeps and little lights flash on it. A few minutes later, a huge swarm of spider-like El Vibrato robots climb out of the canyon, hauling large stone blocks and other materials, which they swiftly weld together with strange blue lights. The entire process takes no more than ten minutes, and the drones vanish back into the canyon leaving behind a weird but very sturdy-looking bridge.
      pl: Majstrujesz przy modelu, aż zapiszczy i migają lampki. Kilka minut później z kanionu wypełza ogromna chmara pająkowatych robotów El Vibrato, ciągnąc wielkie kamienne bloki i inne materiały, które szybko spawają dziwnymi niebieskimi światłami. Cały proces trwa nie więcej niż dziesięć minut, a drony znikają z powrotem w kanionie, zostawiając dziwny, ale bardzo solidny most.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: start
    wpisy:
    - id: wol_ce8b0e734beb352c7ea7
      kontekst: data.json:scripts.railcamp2_usetelescope.start
      linia: 12
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Ayup
      pl: Jo
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: woodenbridge
    wpisy:
    - id: wol_1e0aba143c956fd01df1
      kontekst: data.json:scripts.railcamp2_usetelescope.woodenbridge
      linia: 13
      sekcja_skryptu: woodenbridge
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You look at the wooden bridge you built with your own two hands.  By using those two hands to provide services for the Breadwood lumberjacks, I mean.
      pl: Patrzysz na drewniany most, który zbudowałeś własnymi rękami. Chodzi o to, że użyłeś tych rąk do świadczenia usług drwalom z Breadwood, mam na myśli.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
