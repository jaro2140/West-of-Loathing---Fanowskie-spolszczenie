      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: There's an old mine town up north called Breadwood -- they opened a lumber camp after the mines dried up. If you can fix a deal with them for the lumber we need, I can handle the engineering side of things.
      pl: Na północy jest stare górnicze miasteczko Breadwood. Gdy kopalnie wyschły, otworzyli obóz drwali. Jeśli dogadasz się z nimi w sprawie potrzebnego drewna, ja zajmę się stroną inżynieryjną.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
