      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yep. Got ourselves one helluva canyon to get across, and no materials for bridge-building.
      pl: Tak. Mamy jeden piekielny kanion do przejścia, i żadnych materiałów do budowy mostów.
