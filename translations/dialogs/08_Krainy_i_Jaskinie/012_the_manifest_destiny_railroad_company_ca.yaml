    - id: wol_f66c71d682ed4f04dc19
      kontekst: data.json:scripts.railcamp2_usetelescope.woodenbridge
      linia: 14
      sekcja_skryptu: woodenbridge
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Yes, my own two hands
      pl: Tak, moimi własnymi rękami
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: elvbridge
    wpisy:
    - id: wol_3a0604c4ab5e9929343d
      kontekst: data.json:scripts.railcamp2_usetelescope.elvbridge
      linia: 15
      sekcja_skryptu: elvbridge
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'You run your eyes along the majestic, fantastical, nearly incomprehensible bridge. How is it possible that such technology even exists, let alone that it exists in almost total secrecy? Who were the people that built these machines? And perhaps more importantly: what happened to them?'
      pl: 'Przesuwasz wzrok po majestatycznym, fantastycznym, niemal niepojętym moście. Jak to możliwe, że taka technologia w ogóle istnieje, a co dopiero w niemal całkowitej tajemnicy? Kim byli ludzie, którzy zbudowali te maszyny? A może ważniejsze: co się z nimi stało?'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7fe5878f991030a09d79
      kontekst: data.json:scripts.railcamp2_usetelescope.elvbridge
