      mowca_lub_kanal: postac_po_prawej
      en: Don't think I trust these new-fangled materials and techniques. Look at the weird lights all over it! Still, I guess if it works it works... and the only method we have to test it is to run a train over it.
      pl: Nie ufam tym nowomodnym materiałom i technikom. Spójrz tylko na te dziwne światełka! Ale jeśli działa, to chyba działa... a jedyny sposób, żeby to sprawdzić, to przejechać po tym pociągiem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
