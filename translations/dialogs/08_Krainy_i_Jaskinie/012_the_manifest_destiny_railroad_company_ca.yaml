      kontekst: data.json:scripts.railcamp2_usetelescope.start
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You could activate that El Vibrato bridge model and see if it does anything useful.
      pl: Mógłbyś aktywować model mostu El Vibrato i zobaczyć, czy coś robi.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
