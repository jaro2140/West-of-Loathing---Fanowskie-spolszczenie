      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_d6f8f04ce85f29442b12
      kontekst: data.json:scripts.railcamp2_usetelescope.start
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You could go tell Smee you squared away the lumber shipment from Breadwood.
      pl: Mógłbyś powiedzieć Smee, że załatwiłeś dostawę drewna z Breadwood.
      status: do_korekty
