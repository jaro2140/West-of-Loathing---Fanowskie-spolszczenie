      en: Well, when I signed onto this crew, the last thing I expected to see was a horde of living skeletons swarming up outta nowhere and building a bridge out of themselves.
      pl: Cóż, kiedy podpisałem się w tej załodze, ostatnią rzeczą, jakiej się spodziewałem, była horda żywych szkieletów, rojących się znikąd i budujących z siebie most.
