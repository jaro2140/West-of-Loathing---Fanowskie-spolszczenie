    - id: wol_21f8c723af5a66e37a0a
      kontekst: data.json:scripts.railcamp2_usetelescope.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It sure is big!  It'll take quite a bridge to get across that thing, that's for sure.
      pl: Ale wielkie! Żeby to przekroczyć, trzeba będzie niezłego mostu, to pewne.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
