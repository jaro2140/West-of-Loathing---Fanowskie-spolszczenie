      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You could use your Nex-Mex powers to build a bridge of bones.
      pl: Mógłbyś użyć mocy Nex-Mex, żeby zbudować most z kości.
      status: do_korekty
      wspoldzielony_rekord: false
