      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I don't like it, and I'm pretty sure it's haunted, and I'm pretty sure any train we drive over it is doomed to also be haunted, or cursed, or both.
      pl: Nie podoba mi się, jestem prawie pewien, że jest nawiedzony, i jestem prawie pewien, że każdy pociąg, który po nim przejedzie, również będzie nawiedzony, przeklęty albo jedno i drugie.
