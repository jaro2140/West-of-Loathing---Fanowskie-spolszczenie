      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You pay your meat and look through the telescope at the Big Canyon.
      pl: Płacisz mięso i patrzysz przez teleskop na Wielki Kanion.
      status: do_korekty
