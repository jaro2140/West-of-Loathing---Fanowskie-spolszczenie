- id: wol_9fbb2736e5af51365a2f
  kontekst: data.json:items.boots_grandmas.description
  en: "You think you recognize these boots from a story Grandma told you when you were a kid.\r\n\r\nSee, right before she left to go West, she got a summer job working for a shipbuilder. They needed to test the integrity of the hull, so they gave Grandma a pair of steel-toed boots, and she went around kicking ships to see if they cracked or not.\r\n\r\nThese steel-toed reinforced leather boots with the decorative anchor burned into the side have <i>got</i> to be your grandma's ship-kicking boots. Weirdly, they also have built-in stirrups, which Grandma said she used to stirrup a lot of ships.\r\n\r\n...Don't look at me like that, I'm just telling you a true story about your grandma."
  pl: "Myślisz, że rozpoznajesz te buty z opowieści babci z dzieciństwa.\r\n\r\nWiesz, tuż przed wyjazdem na Zachód dostała letnią pracę u stoczniowca. Musieli testować integralność kadłuba, więc dali babci buty ze stalowymi noskami, a ona chodziła i kopała statki, sprawdzając, czy pękają.\r\n\r\nTe wzmocnione skórzane buty ze stalowymi noskami i ozdobną kotwicą wypaloną z boku <i>muszą</i> być butami babci do kopania statków. Dziwnie, mają też wbudowane strzemiona, których babcia używała, żeby stirrupować sporo statków.\r\n\r\n...Nie patrz na mnie tak, opowiadam ci prawdziwą historię o twojej babci."
  status: do_korekty
  wspoldzielony_rekord: false
  liczba_wystapien: 1
  tokeny_techniczne:
  - <i>
  - </i>
