    - id: wol_6e5f251f4a69fa2ea221
      kontekst: data.json:scripts.fort7_complaintsguy.start
      linia: 2
      sekcja_skryptu: start
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Oh, pretty typical. By which I mean horrible. My shins are acting up, and my eyebrows are on the fritz, and you wouldn't believe the amount of paperwork I've got to do but of course the pencil sharpener is broken so I have to sharpen my pencil by hand with a nail file, and a scorpion got in my coffee and drank half of it.
      pl: O, całkiem typowo. Czyli okropnie. Bolą mnie golenie, brwi szaleją, a nie uwierzysz, ile mam papierologii, ale oczywiście temperówka jest zepsuta, więc muszę temperować ołówek ręcznie pilnikiem do paznokci, a skorpion wpadł mi do kawy i wypił połowę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_94398ae60d2b5636d80a
      kontekst: data.json:scripts.fort7_complaintsguy.start
      linia: 3
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Leave him to his complaining
      pl: Zostaw go przy jego narzekaniu
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
