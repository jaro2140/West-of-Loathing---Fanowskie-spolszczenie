      mowca_lub_kanal: postac_po_prawej
      en: Wow! Thanks a bundle! It's a real tragedy that there are so few selfless and kind-hearted people like you in the world, willing to do a hugely dangerous favor for a total stranger without any expectation of a reward.
      pl: Wow! Wielkie dzięki! Prawdziwa tragedia, że na świecie jest tak mało bezinteresownych, dobrych ludzi jak ty, gotowych zrobić ogromną, niebezpieczną przysługę kompletnemu obcemu bez oczekiwania nagrody.
