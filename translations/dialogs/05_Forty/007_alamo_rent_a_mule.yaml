      kontekst: data.json:scripts.fort7_complaintsguy.intro
      linia: 4
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh great, another customer. As if I didn't have enough to deal with already, what with the paperwork, and the heat, and the mule bites, and someone keeps stealing my lunch out of the employee icebox, and my trick knuckle is acting up again...
      pl: O, świetnie, kolejny klient. Jakbym już nie miał dość na głowie z papierkową robotą, upałem i ugryzieniami mułów, a do tego ktoś ciągle kradnie mój obiad z pracowniczej lodówki i ten przeklęty knykieć znowu mi dokucza...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_e03789129163ef8bffae
      kontekst: data.json:scripts.fort7_complaintsguy.intro
      linia: 5
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Gosh...
      pl: Rany...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
