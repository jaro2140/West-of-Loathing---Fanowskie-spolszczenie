      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: And if all <i>that</i> wasn't bad enough, I went and dropped my daughter's birthday present down a stupid hole at a stupid mine. And will anyone go and get it for me? Ha ha, yeah right.
      pl: Jakby <i>tego</i> było mało, upuściłem prezent urodzinowy córki do głupiej dziury w głupiej kopalni. I czy ktoś zechce mi go przynieść? Ha, jasne.
