    - id: wol_570fdef8f0895889792e
      kontekst: data.json:scripts.fort7_complaintsguy.intro
      linia: 6
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Sure would be nice to get a little peace and quiet, but nope, I've gotta stand here at this counter all day, and the hardwood floor isn't helping my sciatica, let me tell you. Don't even get me started on what they pay us around here, the mules eat better than I do.
      pl: Miło byłoby zaznać ciszy i spokoju, ale nie — muszę cały dzień stać przy ladzie, a drewniana podłoga nie pomaga mojej rwie kulszowej. O płacy nawet nie zaczynajmy; muły jedzą lepiej ode mnie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: intro2
