      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: She picks some more bones out of those scattered on the floor -- ribs, finger bones, fragments of skull, more teeth -- and carefully sorts them on her workbench. You can't really see what happens after that, because you'd have to actually look over her shoulder, and it seems like a bad idea to disturb her.
      pl: Wybiera więcej kości ze sterty na podłodze — żebra, palce, fragmenty czaszki, więcej zębów — i starannie układa je na warsztacie. Dalej nie widać, bo trzeba by zajrzeć przez ramię, a to chyba zły pomysł.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
