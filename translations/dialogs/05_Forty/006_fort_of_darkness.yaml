      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You give her almost a whole mouth's worth of gold teeth, and she draws a long, slow breath. "So many," she whispers, and she seems to see you for the first time. She looks you up and down, then takes a piece of string out of her pocket and uses it to measure your head.
      pl: Dajesz jej prawie całe usta pełne złotych zębów, a ona bierze długi, powolny oddech. „Tyle,” szepcze i wydaje się zauważyć cię po raz pierwszy. Mierzy cię wzrokiem od stóp do głów, potem wyciąga z kieszeni sznurek i mierzy nim twoją głowę.
