      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: After a time, she turns back around, holding a beautiful, ornate crown of bone, ivory, and gold. "Thank you," she whispers as she hands it to you.
      pl: Po chwili odwraca się z powrotem, trzymając piękną, ozdobną koronę z kości, kości słoniowej i złota. „Dziękuję” — szepcze, wręczając ci ją.
