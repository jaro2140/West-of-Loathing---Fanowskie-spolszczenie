      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Everything was great at first! I'm pretty good at scheduling, and I can write shorthand, and I'm an a-plus boot polisher. But then the General went and decided he'd look more serious and sophisticated with a bow-tie, and he expected me to do the tying for him.
      pl: Na początku wszystko było świetnie! Całkiem dobrze układam harmonogramy, umiem stenografować i poleruję buty na szóstkę z plusem. Ale potem Generał uznał, że w muszce będzie wyglądać poważniej i bardziej wyrafinowanie, i oczekiwał, że będę mu ją wiązać.
