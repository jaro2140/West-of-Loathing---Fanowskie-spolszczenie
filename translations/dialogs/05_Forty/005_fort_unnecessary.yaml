    - id: wol_91a837c8e6cc33e1a88b
      kontekst: data.json:scripts.fort5_intro.start
      linia: 3
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Prob<i>lemsss</i>. Welcome to Camp FUBAR, where all the army's idiots and rejects are sent so they're out of the way. I have had it up to my <i>eyeballs</i> trying to run this place. <i>Please</i> help these morons figure out their malfunctions, so they can muster out of here and leave me in peace!
      pl: Prob<i>lemyyy.</i> Witaj w Obozie FUBAR, dokąd wysyła się wszystkich wojskowych idiotów i odrzutków, żeby nie zawadzali. Mam już <i>po same gałki oczne</i> prowadzenia tego miejsca. <i>Proszę,</i> pomóż tym kretynom rozgryźć ich usterki, żeby mogli się stąd wymeldować i dać mi spokój!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
