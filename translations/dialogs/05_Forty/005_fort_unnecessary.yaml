  skrypt: fort5_cannonguy
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 21
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_36240659b847b78f3cc8
      kontekst: data.json:scripts.fort5_cannonguy.start
      linia: 1
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Howdy. What's the haps?
      pl: Witaj. Co się dzieje?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_d2d87ac7500f3a90cf73
      kontekst: data.json:scripts.fort5_cannonguy.start
      linia: 2
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'm supposed to be a cannoneer, but I'm terrible at loading cannons. They always explode -- except not the way they're supposed to explode. Or else they don't explode at all.
      pl: Podobno jestem kanonierem, ale fatalnie mi idzie ładowanie armat. Zawsze wybuchają — tyle że nie tak, jak powinny wybuchać. Albo nie wybuchają wcale.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: start2
    wpisy:
    - id: wol_9327b6496528a0798e82
      kontekst: data.json:scripts.fort5_cannonguy.start2
      linia: 5
      sekcja_skryptu: start2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: The only time I ever got one to fire right, the cannonball knocked my sergeant's hat off, and he was standing behind me. I still can't figure out how that happened.
      pl: Jedyny raz, gdy udało mi się z takiej dobrze wystrzelić, kula armatnia strąciła kapelusz mojemu sierżantowi, który stał za mną. Nadal nie wiem, jak do tego doszło.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_bb3b819b3a67937c1d85
      kontekst: data.json:scripts.fort5_cannonguy.start2
      linia: 6
      sekcja_skryptu: start2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: So, they assigned me to this loser squad, and said I can't report back for a proper duty until I've figured out how to load a cannon right.
      pl: Przydzielili mnie więc do oddziału nieudaczników i powiedzieli, że nie mogę wrócić do normalnej służby, dopóki nie nauczę się prawidłowo ładować armaty.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_b45a7cf1df6a45b17afc
      kontekst: data.json:scripts.fort5_cannonguy.start2
      linia: 7
      sekcja_skryptu: start2
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Help him figure it out [Mysticality 45]
      pl: Pomóż mu to ogarnąć [Mistycyzm 45]
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '[Mysticality 45]'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: show
    wpisy:
    - id: wol_407f096db157a7b4a1c7
      kontekst: data.json:scripts.fort5_cannonguy.show
      linia: 8
      sekcja_skryptu: show
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The two of you go over the various ingredients and tools involved, and eventually you determine that the gunpowder should be put in first, and then the cloth wadding, which gets tamped down with a long stick. After that you take the stick <i>back out again</i>, and use it to push in the cannonball. And then the fuse goes in the hole in the back, and that's the part you light.
      pl: Omawiacie składniki i narzędzia, aż ustalacie, że najpierw wsypuje się proch, potem wata z tkaniny, którą ubija długim kijem. Potem kij <i>wyciąga się z powrotem</i> i wciska nim kulę armatnią. Na koniec lont wchodzi w otwór z tyłu — i to właśnie podpala się.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_5d871cc30e72a2a144b8
      kontekst: data.json:scripts.fort5_cannonguy.show
      linia: 9
      sekcja_skryptu: show
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Watch him try
      pl: Patrz, jak próbuje
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
