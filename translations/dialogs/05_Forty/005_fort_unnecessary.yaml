      kontekst: data.json:scripts.fort5_intro.two
      linia: 6
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: 'You''ll need to talk to them individually for more information, but the brief is: we''ve got a scout who''s blind as a bat, a cook who can''t figure out how to make corned beef hash on toast, a guy who can''t load and fire a cannon without it blowing up or maybe shooting <i>backwards</i>, a guy who, <i>somehow</i>, and I can''t for the life of me figure it out, is <i>too bowlegged</i> to ride a horse, and a kid who was sent here because he can''t figure out how to tie a bow-tie. Oh, and just to put the icing on the cake, we have infinite goblins living in our storage shed.'
      pl: 'Musisz porozmawiać z nimi indywidualnie, aby uzyskać więcej informacji, ale w skrócie: mamy zwiadowcę, który jest ślepy jak nietoperz, kucharza, który nie może rozgryźć, jak zrobić kukurydziany hasz wołowy na toście, faceta, który nie może załadować i wystrzelić armaty, żeby nie wybuchła albo nie strzeliła <i>do tyłu</i>, faceta, który <i>jakoś</i> — i za nic w świecie nie mogę tego pojąć — ma <i>zbyt krzywe nogi</i>, żeby jeździć konno, i dzieciaka, który został wysłany tutaj, bo nie umie zawiązać muszki. I żeby położyć lukier na torcie, mamy nieskończone gobliny żyjące w naszej szopie.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      - <i>
      - </i>
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
