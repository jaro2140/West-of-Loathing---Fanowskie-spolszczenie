- kolejnosc_w_danych_gry: 1418
  skrypt: fort2_bigpit
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 8
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_00ba7024c4736b21d285
      kontekst: data.json:scripts.fort2_bigpit.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This mass grave is absolutely teeming with those skeletal riflemen.  They don't seem to be interested in getting out, but you could definitely jump in there if you were itching for a fight.
      pl: Ten masowy grób roi się od szkieletowych strzelców. Nie wyglądają na zainteresowanych wydostaniem się, ale mógłbyś wskoczyć, jeśli masz ochotę na walkę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_e4b157cbd4703dcb5abc
      kontekst: data.json:scripts.fort2_bigpit.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's one wandering in the end of the pit nearest you.
      pl: Jeden krąży przy końcu dołu najbliżej ciebie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_adee372abfd8b800f7bb
      kontekst: data.json:scripts.fort2_bigpit.start
      linia: 3
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Hop in! [Fight]
      pl: Wskakuj! [Walka]
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne:
      - '[Fight]'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: hardstart
    wpisy:
    - id: wol_adee372abfd8b800f7bb
      kontekst: data.json:scripts.fort2_bigpit.hardstart
      linia: 5
      sekcja_skryptu: hardstart
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Hop in! [Fight]
      pl: Wskakuj! [Walka]
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne:
      - '[Fight]'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_49553b2d1fdc600ee147
      kontekst: data.json:scripts.fort2_bigpit.hardstart
      linia: 6
      sekcja_skryptu: hardstart
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A voice in your head convinces you that you should not spend any more time down in a pit today. The whole rest of the world awaits!
      pl: Głos w twojej głowie przekonuje cię, że nie powinieneś dziś spędzać więcej czasu w dole. Cała reszta świata czeka!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: win
    wpisy:
    - id: wol_1005b2fb6e77a7bc923b
      kontekst: data.json:scripts.fort2_bigpit.win
      linia: 1
      sekcja_skryptu: win
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You brush yourself off, collect your loot, and climb back out of the pit.
      pl: Otrzepujesz się, zbierasz łupy i wspinasz z dołu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: lose
    wpisy:
    - id: wol_e2e7e6a45c68e71c6419
      kontekst: data.json:scripts.fort2_bigpit.lose
      linia: 1
      sekcja_skryptu: lose
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'It''s like your mother always told you:  Don''t jump into a pit filled with skeletal riflemen if you''re not pretty sure you can do it without getting your ass handed to you.'
      pl: 'Jak zawsze mówiła ci matka: nie skacz do dołu pełnego szkieletów-strzelców, jeśli nie masz sporej pewności, że ujdzie ci to bez lanego.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: dontexplode
    wpisy:
    - id: wol_80f4eb93dd77f0d3662c
      kontekst: data.json:scripts.fort2_bigpit.dontexplode
      linia: 4
      sekcja_skryptu: dontexplode
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Yeah, it's weird how often she said that
      pl: Ta, dziwne, jak często to mówiła
