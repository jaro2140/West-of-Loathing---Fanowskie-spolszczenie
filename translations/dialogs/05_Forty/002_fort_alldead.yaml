      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It seems to have been written by one of the Necromancer's cultists. He and several others were reanimating the dead soldiers here, on the theory that the best undead army would be a literal undead army. The hitch in the plan came when they raised the officers, who decided they weren't going to take orders from a bunch of weirdo civilians. The last entry suggests the author and his cohorts were planning on abandoning their station and reporting back to the Necromancer, but the entry ends abruptly in the middle of a sentence.
