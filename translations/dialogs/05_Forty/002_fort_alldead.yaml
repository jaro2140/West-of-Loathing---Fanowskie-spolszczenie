      linia: 2
      sekcja_skryptu: deaddead
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I didn't know skeletons eat. And I didn't know that they crap. But I guess you learn something new every day.
      pl: Nie wiedziałam, że szkielety jedzą. I nie wiedziałam, że robią kupę. Ale chyba codziennie człowiek uczy się czegoś nowego.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7e69f2f9da1127d59d0f
      kontekst: data.json:scripts.fort2_checkpoison.deaddead
      linia: 3
      sekcja_skryptu: deaddead
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: And that's two things, so we're ahead of the game.
      pl: To już dwie rzeczy, więc wyprzedzamy plan.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_19267998e0ac19c364d9
      kontekst: data.json:scripts.fort2_checkpoison.deaddead
      linia: 4
      sekcja_skryptu: deaddead
      typ: option
