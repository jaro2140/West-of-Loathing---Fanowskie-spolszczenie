      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It appears that Alice's idea worked.  There's not a single skeleton left... alive... in the entire fort.
      pl: Wygląda na to, że pomysł Alice zadziałał. Nie ma już ani jednego szkieletu... żywego... w całym forcie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
