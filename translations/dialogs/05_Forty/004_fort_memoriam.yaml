      kontekst: data.json:scripts.fort4_spittoon.five
      linia: 10
      sekcja_skryptu: five
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: With a fanfare of sad trombones and a choir of angels retching, a sword rises out of the spittoon, held aloft by a wet, bedraggled, and miserable-looking woman's arm. Since you're already kneeling, the arm wastes no time before tapping you on both shoulders with the sword, splashing your clothes with yellow slime and officially declaring you @firstname@ @lastname@, @King@ of Filth. Congratulations. The sword clatters on the floor as the hand drops it with a shudder and withdraws into the spittoon.
      pl: Przy fanfarze smutnych puzonów i chóru wymiotujących aniołów ze spluwaczki wynurza się miecz, unoszony przez mokrą, zalaną i nieszczęśliwie wyglądającą kobiecą rękę. Skoro już klęczysz, ręka nie traci czasu i dotyka mieczem obu twoich ramion, obryzgując ubrania żółtą breją i oficjalnie ogłaszając cię @firstname@ @lastname@, @King@ Brudu. Gratulacje. Miecz brzęczy o podłogę, gdy dłoń z drżeniem go puszcza i cofa się do spluwaczki.
      status: do_korekty
