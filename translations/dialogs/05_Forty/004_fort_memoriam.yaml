    - id: wol_c0b79ddbb65d751bd4fe
      kontekst: data.json:scripts.fort4_spittoon.two
      linia: 4
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: All right, well, you crouch down next to the spittoon. From the nauseatingly sweet stench coming off of it, it appears that these nerds haven't been using it as a makeshift urinal as you may have suspected, but rather they're using bright yellow lemon-lime soda-flavored chewing tobacco. Unless...
      pl: Dobra, kucasz przy spluwaczce. Z mdląco słodkiego smrodu, który z niej bije, wnioskujesz, że te kujony nie używały jej jako prowizorycznego pisuaru, jak podejrzewałeś — one żują jaskrawożółty tytoń o smaku cytrynowo-limonkowej oranżady. Chyba że...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
