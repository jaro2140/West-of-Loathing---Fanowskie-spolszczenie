      kontekst: data.json:scripts.fort4_spittoon.four
      linia: 8
      sekcja_skryptu: four
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Really? You're going to put your hand in the nerds' piss and/or spit bucket? Just gonna dive right in there, huh? Just gonna splish-splash around in that sticky yellow broth of spit and pee with no restraint whatsoever?
      pl: Naprawdę? Włożysz rękę do kubełka na mocz i/lub plwocinę nerdów? Po prostu nurkniesz tam, co? Po prostu będziesz pluskać się w tej lepkiej, żółtej zupie ze śliny i moczu bez żadnej powściągliwości?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
