      kontekst: data.json:scripts.fort4_spittoon.two
      linia: 5
      sekcja_skryptu: two
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Unless?
      pl: Chyba że?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: three
    wpisy:
    - id: wol_97d5dd44634770e3efdb
      kontekst: data.json:scripts.fort4_spittoon.three
      linia: 6
      sekcja_skryptu: three
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Well, another possibility is that they <i>have</i> been using it as a urinal, and they're all extremely diabetic. Which, now I think about it, is a real possibility. In fact, it is probable that both these things are true.
      pl: No, inna możliwość jest taka, że <i>używali</i> tego jako pisuaru i wszyscy mają ciężką cukrzycę. Co, jak teraz o tym myślę, jest realną możliwością. W gruncie rzeczy prawdopodobne, że obie te rzeczy są prawdziwe.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
