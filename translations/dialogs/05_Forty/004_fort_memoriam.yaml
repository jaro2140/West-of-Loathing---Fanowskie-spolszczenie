      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The liquid in this spittoon is bright yellow. I feel like that's all that needs to be said about it.
      pl: Ciecz w tej spluwaczce jest jaskrawożółta. Chyba tyle wystarczy o niej powiedzieć.
      status: do_korekty
