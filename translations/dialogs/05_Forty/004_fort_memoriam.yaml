      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Nah. I mean, I like games, that's why I hang out with these guys, but I've gotten bored of these strategy wargames. I want something different.
      pl: Nie. To znaczy, lubię gry, dlatego trzymam się z tymi gośćmi, ale znudziły mi się strategiczne gry wojenne. Chcę czegoś innego.
