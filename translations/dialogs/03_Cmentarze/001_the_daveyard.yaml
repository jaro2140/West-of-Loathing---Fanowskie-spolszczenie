      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It says to take a pile of human ashes, spread them out in the shape of a person inside a red chalk ritual circle, then sprinkle them with stardust and place a mostly-perfect (or better) glass sphere where the heart would be.
