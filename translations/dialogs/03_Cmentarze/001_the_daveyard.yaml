      linia: 4
      sekcja_skryptu: dig2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You reach into the garbage bag and are surprised to find that's full of...  pudding?  No, it's not <i>just</i> pudding.  It's pudding and motor oil.
      pl: Sięgasz do worka na śmieci i zdziwiony stwierdzasz, że jest pełen... budyniu? Nie, to nie <i>tylko</i> budyń. To budyń i olej silnikowy.
