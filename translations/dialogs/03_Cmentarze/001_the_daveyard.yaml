      linia: 8
      sekcja_skryptu: dig3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You unglob the wad and dry it off, then wash your arm in a nearby ditch.
      pl: Rozklejasz kulkę, osusz ją, potem myjesz rękę w pobliskim rowie.
