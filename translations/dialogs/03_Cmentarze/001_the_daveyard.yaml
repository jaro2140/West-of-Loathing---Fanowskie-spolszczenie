      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The universe shudders ecstatically around you as the ashes writhe and transform into the glammest skeleton you've ever seen.
      pl: Wszechświat drży w ekstazie wokół ciebie, gdy popiół wije się i zamienia w najbardziej glamowy szkielet, jaki kiedykolwiek widziałeś.
