      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You dig up the grave and pry open the coffin.  Instead of a corpse, it contains... a garbage bag?
      pl: Wykopujesz grób i otwierasz trumnę. Zamiast zwłok jest... worek na śmieci?
