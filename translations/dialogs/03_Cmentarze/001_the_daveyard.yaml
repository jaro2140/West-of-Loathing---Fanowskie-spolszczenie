      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You finally manage to reach all the way to the bottom of the bag, and retrieve a sodden lump from the bottom.
      pl: Wreszcie sięgasz na sam dół worka i wyciągasz przemoczoną bryłę.
