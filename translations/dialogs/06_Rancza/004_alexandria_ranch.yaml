      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: When I say "for some reason" I mean that I don't know what that reason was.
      pl: Kiedy mówię "z jakiegoś powodu" mam na myśli, że nie wiem, co to był za powód.
