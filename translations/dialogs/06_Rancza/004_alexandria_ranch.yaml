      linia: 28
      sekcja_skryptu: fortknow
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: So that's what that soldier was trying to warn me about. I assumed he meant goblins or something.
      pl: Czyli przed tym próbował ostrzec mnie tamten żołnierz. Myślałam, że chodziło mu o gobliny czy coś.
