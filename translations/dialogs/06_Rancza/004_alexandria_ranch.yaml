      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Mmm. Okay. I suppose it's better than living in a crater. And some of these volumes look salvageable. <i>sigh.</i> All right, I'll head there directly.
      pl: Mmm. Dobrze. Chyba to lepsze niż mieszkanie w kraterze. A niektóre z tych tomów wyglądają na możliwe do uratowania. <i>westchnienie.</i> Dobrze, ruszę tam natychmiast.
