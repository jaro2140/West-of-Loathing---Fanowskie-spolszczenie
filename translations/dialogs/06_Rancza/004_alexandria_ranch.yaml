      sekcja_skryptu: next
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I happened to see you through a time rift and pulled you through just before the explosion. Don't ask me to explain that.
      pl: Przypadkiem zobaczyłam cię przez szczelinę czasową i przeciągnęłam tuż przed wybuchem. Nie proś, żebym to wyjaśniała.
