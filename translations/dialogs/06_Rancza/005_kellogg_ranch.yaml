      kontekst: data.json:scripts.ranch5_locker3_diary.start
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Sadly, the contents aren't particularly juicy. The author joined Kellogg's health program because she'd had several relatives with poor health and wanted to preserve her own. She found the ranch to be pretty boring, but appreciated that the lack of anything much else to do gave her plenty of time to spend knitting, which was her favorite hobby. The last entry mentions Kellogg's death (rumored but unconfirmed to be due to a brain aneurysm caused by outrage at hearing a dirty joke), and that the author was returning home. Guess she forgot the diary when she left.
      pl: Niestety, treść nie jest szczególnie soczysta. Autorka dołączyła do programu zdrowotnego Kellogga, bo kilku krewnych chorowało i chciała zadbać o siebie. Ranczo uznała za dość nudne, ale doceniła, że brak innych zajęć daje mnóstwo czasu na szydełkowanie — jej ulubione hobby. Ostatni wpis wspomina śmierć Kellogga (plotka, niepotwierdzona, mówi o wylewie po oburzeniu brudnym żartem) i powrót autorki do domu. Chyba zapomniała pamiętnika przy wyjeździe.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
