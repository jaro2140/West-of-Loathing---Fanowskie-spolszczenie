      mowca_lub_kanal: postac_po_lewej
      en: Let's see, looks like the tour starts at the grand opening of someplace called Punland, and Boring Springs is the second stop. After that he's going to Dirtwater, Frisco, Portalhand, Beantown, Ocean City... the last stop just says "The Universe?" This all seems very bad somehow.
