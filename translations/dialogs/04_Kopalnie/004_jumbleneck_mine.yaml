  skrypt: mine4_top_elevator
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 7
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_0ed59d938cf2c2251b78
      kontekst: data.json:scripts.mine4_top_elevator.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This elevator is pretty dusty inside, and doesn't appear to have been maintained for quite a while. It does still seem functional, but the control lever is chained and padlocked.
      pl: Ta winda jest w środku dość zakurzona i nie wygląda, żeby ktoś ją od dawna serwisował. Nadal wydaje się sprawna, ale dźwignia sterująca jest zapięta na łańcuch i kłódkę.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_891eb40b621e950b990b
      kontekst: data.json:scripts.mine4_top_elevator.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You also notice that the shaft is totally silent. You'd expect to hear the rumbling of minecarts and the clanking of pickaxes echoing up from below, but there's nothing.
      pl: Zauważasz też, że szyb jest całkowicie cichy. Spodziewałbyś się słyszeć stukot wagoników i brzęk kilofów dobiegający z dołu, ale nic.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_d5c9835d7c32398f347c
      kontekst: data.json:scripts.mine4_top_elevator.start
      linia: 3
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Unlock the lever [elevator key]
      pl: Odblokuj dźwignię [klucz windy]
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '[elevator key]'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: key
    wpisy:
    - id: wol_b461684b75cdcf5e9e6b
      kontekst: data.json:scripts.mine4_top_elevator.key
      linia: 4
      sekcja_skryptu: key
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You unlock the lever with the foreman's key and give it a yank. The elevator shudders as it begins to descend, accompanied by the sound of clanking chains and grinding pulleys. Very quickly, it becomes too dark to see and you pull out your lantern. Very slowly, the elevator reaches its destination. You pull the door open and peer into the gloom.
      pl: Odblokowujesz dźwignię kluczem brygadzisty i szarpniesz. Winda drży, zaczynając schodzić, przy dźwięku brzęczących łańcuchów i skrzypiących kół. Bardzo szybko robi się za ciemno i wyciągasz latarnię. Bardzo powoli winda dociera na miejsce. Otwierasz drzwi i zaglądasz w mrok.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
