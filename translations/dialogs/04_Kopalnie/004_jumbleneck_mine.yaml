      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You pick the lock, remove the chains, and give the lever a yank. The elevator shudders as it begins to descend, accompanied by the sound of clanking chains and grinding pulleys. Very quickly, it becomes too dark to see and you pull out your lantern. Very slowly, the elevator reaches its destination. You pull the door open and peer into the gloom.
      pl: Otwierasz zamek, zdejmujesz łańcuchy i szarpiesz dźwignię. Winda drży, zaczynając schodzić, przy dźwięku brzęczących łańcuchów i zgrzytających krążków. Bardzo szybko robi się za ciemno i wyciągasz latarnię. Bardzo powoli winda dociera na miejsce. Otwierasz drzwi i zaglądasz w mrok.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
