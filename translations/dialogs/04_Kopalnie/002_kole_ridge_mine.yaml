      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The label on the second one is covered in some kind of white goo.
      pl: Etykieta na drugiej jest pokryta jakąś białą mazią.
