  - etykieta: open2
    wpisy:
    - id: wol_6b3ffb5824ef28caa966
      kontekst: data.json:scripts.mine2_locker.open2
      linia: 9
      sekcja_skryptu: open2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You open the door to reveal a skeleton covered in the same white goo that was on the outside of the locker.
      pl: Otwierasz drzwi i ukazuje się szkielet pokryty tą samą białą breją, co z zewnątrz szafki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_2b38a088d1a32f4c8008
      kontekst: data.json:scripts.mine2_locker.open2
      linia: 10
      sekcja_skryptu: open2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Ah.  You get it.  This guy must've died after his coworkers played a prank on him where they stuffed him into his locker and then filled it with shaving cream.
      pl: 'Ach. Rozumiesz. Ten gość musiał zginąć, gdy współpracownicy zrobili mu psikusa: wcisnęli go do szafki i wypełnili ją pianką do golenia.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_fccb1480c36534aa2107
      kontekst: data.json:scripts.mine2_locker.open2
      linia: 11
      sekcja_skryptu: open2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"I can''t believe you dang jerks stuffed me into my locker and then filled it with shaving cream!  I died from that!" yells the skeleton, confirming both your insight and his vengeful, murderous intent.'
      pl: „Nie mogę uwierzyć, że wy, przeklęte dranie, wsadziliście mnie do szafki i wypełniliście ją pianką do golenia! Od tego umarłem!” wrzeszczy szkielet, potwierdzając zarówno twoją intuicję, jak i jego morderczy, mściwy zamiar.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: wol_474a0637a0d490a7b2b4
      kontekst: data.json:scripts.mine2_locker.open2
      linia: 12
      sekcja_skryptu: open2
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Get ready for a fight. [Fight]
      pl: Przygotuj się do walki. [Walka]
      status: do_korekty
