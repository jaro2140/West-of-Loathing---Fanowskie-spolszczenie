      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Nuts, there's nothing inside except a couple of old empty milk bottles and their discarded paper caps. The caps advertise the Butterfield Dairy, with a little logo in the shape of the territory and a star presumably marking the dairy's location.
      pl: A niech to, w środku nic nie ma poza paroma starymi pustymi butelkami po mleku i wyrzuconymi papierowymi nakładkami. Nakładki reklamują Butterfield Dairy, z małym logo w kształcie terytorium i gwiazdą zapewne oznaczającą lokalizację mleczarni.
