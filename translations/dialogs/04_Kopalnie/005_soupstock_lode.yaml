      minigra_lub_feature: false
      uwagi: []
    - id: wol_5b427ee9ce980b1b6aa1
      kontekst: data.json:scripts.mine5_diary2.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This mine is the worst. It sucks so bad here. I have been in some lousy mines, but this one really takes the cake. Everything smells like soup! The walls are slick with it! I swear, I can feel it getting into my pores! If I went to a doctor for a blood test he'd probably tell me my blood is tomato-basil bisque or whatever.
      pl: Ta kopalnia jest najgorsza. Tu jest tak okropnie. Byłem w kiepskich kopalniach, ale ta przechodzi sama siebie.. Wszystko pachnie zupą! Ściany są od niej śliskie! Przysięgam, czuję, jak wchodzi mi w pory! Gdybym poszedł na badanie krwi, lekarz powiedziałby, że mam zupę pomidorowo-bazyliową czy coś.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: page2
    wpisy:
    - id: wol_aae252b3e8012dca82ae
      kontekst: data.json:scripts.mine5_diary2.page2
      linia: 4
      sekcja_skryptu: page2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Entry 2:'
      pl: 'Wpis 2:'
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_99d654b998324db654f6
      kontekst: data.json:scripts.mine5_diary2.page2
      linia: 5
      sekcja_skryptu: page2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: We've finally managed to get deep enough to hear The Master, but it turned out the dang soup table is higher than we thought. We're spending 90% of our time bailing the stuff out, and only 10% digging.
      pl: Wreszcie udało nam się zejść na tyle głęboko, by usłyszeć Mistrza, ale okazało się, że cholerny zwierciadło zupy jest wyżej, niż myśleliśmy. 90% czasu wylewamy tę breję, a tylko 10% kopiemy.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '% of our time bailing the stuff out, and only 10%'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_0ee00dc2cdecf47e6cc7
      kontekst: data.json:scripts.mine5_diary2.page2
      linia: 6
      sekcja_skryptu: page2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: I've got noodles in my boots. I hate this so much.
      pl: Mam makaron w butach. Nienawidzę tego tak bardzo.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: page3
    wpisy:
    - id: wol_d2c22007d4fa3d470c73
      kontekst: data.json:scripts.mine5_diary2.page3
      linia: 8
      sekcja_skryptu: page3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Entry 3:'
      pl: 'Wpis 3:'
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_eafaf8b26b896830fd22
      kontekst: data.json:scripts.mine5_diary2.page3
      linia: 9
      sekcja_skryptu: page3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Now the damn elevator's busted.  It was always making a rattling noise and the guys off-shift couldn't sleep -- that finally stopped, but it stopped because the elevator itself stopped and we can't move it at all!  Why did we even set up camp here?
      pl: Teraz ta cholerna winda padła. Zawsze grzechotała i chłopaki po zmianie nie mogli spać — w końcu przestała, ale dlatego, że padła sama winda i w ogóle nie da się jej ruszyć! Po co w ogóle rozbiliśmy tu obóz?
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7b9bb9802dbe1aa76412
      kontekst: data.json:scripts.mine5_diary2.page3
      linia: 10
      sekcja_skryptu: page3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: I had to spend the whole day scrounging around to find replacement 137, 59, and 23 lb. compression springs for repairs. Will install them tomorrow.
      pl: Cały dzień musiałem grzebać, żeby znaleźć zapasowe sprężyny dociskowe na 137, 59 i 23 funty do napraw. Jutro je zamontuję.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: page4
    wpisy:
    - id: wol_a35dd9f01b172248a882
      kontekst: data.json:scripts.mine5_diary2.page4
      linia: 12
      sekcja_skryptu: page4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Entry 4:'
      pl: 'Wpis 4:'
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_6ddf6a7c9c0a8d05469f
      kontekst: data.json:scripts.mine5_diary2.page4
      linia: 13
      sekcja_skryptu: page4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Boss says we're giving up here and heading into a real deep mine they found up northwest. It's a shame we wasted all this work, but hot damn it'll be good to get away from this soup. I will never eat soup again in my life.
      pl: Szef mówi, że tu kończymy i idziemy do prawdziwie głębokiej kopalni, którą znaleźli na północny zachód. Szkoda zmarnowanej roboty, ale cholera, dobrze będzie uciec od tej zupy. W życiu już nigdy nie zjem zupy.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_23fdc3d69991750723e3
      kontekst: data.json:scripts.mine5_diary2.page4
      linia: 14
      sekcja_skryptu: page4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Got the springs installed proper-like, with the strongest behind the shortest bolt and so on, but there's no time to wrench everything down.  Gotta pack! Not like the elevator matters much anyway, any more.
      pl: Sprężyny zamontowane jak trzeba — najmocniejsza za najkrótszą śrubą i tak dalej — ale nie ma czasu, żeby wszystko dokręcić. Trzeba pakować! I tak winda już niewiele znaczy.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_ae3c92e8f495da67c17b
      kontekst: data.json:scripts.mine5_diary2.page4
      linia: 15
      sekcja_skryptu: page4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: I really hope I don't screw up again and forget my diary here when it's time to leave. I don't think I've ever managed to fill in more than ten pages in the same diary.
      pl: Naprawdę mam nadzieję, że znowu nie spartolę i nie zapomnę tu dziennika, gdy nadejdzie czas wyjazdu. Chyba nigdy nie udało mi się wypełnić więcej niż dziesięciu stron w tym samym dzienniku.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_302b17884a2c83d55cb3
      kontekst: data.json:scripts.mine5_diary2.page4
      linia: 16
      sekcja_skryptu: page4
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: That's the last entry.
      pl: To ostatni wpis.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
