      linia: 16
      sekcja_skryptu: himurray4
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Quite! I'm oversensitive to psychic emanations, you see. Always have been. As it happens, this curious little hole is absolutely overflowing with them, and they're none too friendly, I can tell you that for certain. It was risky business, my coming down here, but I took the gamble. And lost! It's a miraculous thing that you happened by when you did, my friend. We should both get out of here as soon as possible.
      pl: Owszem! Widzisz, jestem nadwrażliwy na emanacje psychiczne. Zawsze byłem. Tak się składa, że ta osobliwa dziura wręcz się od nich przelewa, a one nie są zbyt przyjazne — tyle mogę powiedzieć z całą pewnością. Zejście tutaj było ryzykowne, ale zaryzykowałem. I przegrałem! To cud, że zjawiłeś się akurat w tej chwili, przyjacielu. Powinniśmy obaj wydostać się stąd jak najszybciej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
