    - id: wol_cdafe6df108b6c3a319f
      kontekst: data.json:scripts.mine3_murray.hathim
      linia: 4
      sekcja_skryptu: hathim
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Oh my goodness! Where am-- ah, I'm still in the mine. Uninjured, and hungry but not starving, so I can't have been here very long. Perhaps a day. Good, good! Well, I must have you to thank, friend!
      pl: O rany Boże! Gdzie ja— ach, wciąż jestem w kopalni. Bez obrażeń, głodny, ale nie umierający z głodu, więc nie mogę tu być zbyt długo. Może dzień. Dobrze, dobrze! Cóż, to chyba tobie mam dziękować, przyjacielu!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_c1b6d16a9f22bf108f79
