      sekcja_skryptu: himurray
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: I should say so!  Thank you for outfitting me with this... remarkable device!
      pl: I słusznie! Dziękuję za wyposażenie mnie w to... niezwykłe urządzenie!
