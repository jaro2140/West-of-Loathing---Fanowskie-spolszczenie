- kolejnosc_w_danych_gry: 2572
  skrypt: testarea2_skull
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 14
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_989ae6edc7e64a5f0948
      kontekst: data.json:scripts.testarea2_skull.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Good morning. In less than an hour, aircraft from here will join others from around the world. And you will be launching the largest aerial battle in this history of mankind.<p>Mankind -- that word should have new meaning for all of us today.<p>We can't be consumed by our petty differences anymore.
      pl: Dzień dobry. Za mniej niż godzinę samoloty stąd dołączą do innych z całego świata. I rozpoczniesz największą bitwę powietrzną w historii ludzkości.<p>Ludzkość — to słowo powinno dziś nabrać nowego znaczenia dla nas wszystkich.<p>Nie możemy już pozwalać, by pochłonęły nas nasze marne różnice.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <p>
      - <p>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_20d3bc3975fd5f44f16a
      kontekst: data.json:scripts.testarea2_skull.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: We will be united in our common interests.<p>Perhaps its fate that today is the 4th of July, and you will once again be fighting for our freedom, not from tyranny, oppression, or persecution -- but from annihilation.
      pl: Zjednoczymy się we wspólnych interesach.<p>Być może to los, że dziś jest 4 lipca i znów walczycie o naszą wolność — nie przed tyranią, uciskiem czy prześladowaniem, lecz przed unicestwieniem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <p>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_b1ac126b991e6d8262c3
      kontekst: data.json:scripts.testarea2_skull.start
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: We're fighting for our right to live, to exist.<p>And should we win the day, the 4th of July will no longer be known as an American holiday, but as the day when the world declared in one voice:<p>"We will not go quietly into the night!<p>We will not vanish without a fight!<p>We're going to live on!<p>We're going to survive!"<p>Today, we celebrate our Independence Day!
      pl: Walczymy o prawo do życia, do istnienia.<p>Jeśli wygramy ten dzień, 4 lipca nie będzie już znane jako amerykańskie święto, lecz jako dzień, w którym świat jednym głosem ogłosił:<p>„Nie odejdziemy cicho w noc!<p>Nie znikniemy bez walki!<p>Będziemy żyć dalej!<p>Przetrwamy!”<p>Dziś świętujemy nasz Dzień Niepodległości!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <p>
      - <p>
      - <p>
      - <p>
      - <p>
      - <p>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_67f13485880691e95ac8
      kontekst: data.json:scripts.testarea2_skull.start
      linia: 4
      sekcja_skryptu: start
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: '  Well, that was a rousing speech!'
      pl: '  Cóż, to była porywająca mowa!'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_193a786ad2b76196579c
      kontekst: data.json:scripts.testarea2_skull.start
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '  You see another dude also listening.'
      pl: '  Widzisz kolejnego gościa, który też słucha.'
