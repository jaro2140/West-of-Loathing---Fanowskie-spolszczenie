- kolejnosc_w_danych_gry: 2561
  skrypt: start_createchar
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 10
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_9e4920162bb4f6e2c012
      kontekst: data.json:scripts.start_createchar.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Cow Punchers solve their problems with their fists, whether it's shaking them at a disagreeable feller in a disreputable saloon or using them to punch a slightly more disagreeable feller in a slightly less reputable saloon.
      pl: Krowobij rozwiązuje problemy pięściami — czasem macha nimi groźnie pod nosem obibokowi w podejrzanym saloonie, czasem wpakowuje je prosto w ryj jeszcze gorszemu łajdakowi w jeszcze podejrzańszym saloonie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_c5445676aa842fc2d20f
      kontekst: data.json:scripts.start_createchar.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You've heard that Cow Punchers are in demand out West since The Cows Came Home, which stands to reason.  The Cows aren't gonna punch themselves, after all.
      pl: Podobno na Zachodzie Krowobije są na wagę złota od czasu, gdy Krowy Wróciły do Domu. Ma sens — krowy same się przecież nie przypiekną.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_523542ed7cefb3e951a0
      kontekst: data.json:scripts.start_createchar.start
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Magic and cooking are inextricably intertwined in Loathing, and the Beanslinger is the mystical master of both.
      pl: W Loathing magia i gotowanie splatają się nierozerwalnie, a Fasolomanta włada oboma sztukami jak nikt inny.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_381aca7dd8fc97b98c69
      kontekst: data.json:scripts.start_createchar.start
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You've heard there's a shortage of cooks out West since The Cows Came Home, due to most of the cooks having been brutally killed by The Cows.
      pl: Mówią, że na Zachodzie brakuje kucharzy od czasu, gdy Krowy Wróciły do Domu — większość padła ofiarą brutalnych ataków Krow.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_796c77f5aae9a64bea3f
      kontekst: data.json:scripts.start_createchar.start
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Snake Oilers rely on their moxie and chutzpah to tame snakes, their fearlessness to extract potent oils from those snakes, and their cleverness to manufacture and sell potions made from those oils.
      pl: 'Olejownik Wężowy stawia na Ikrę i bezczelność: oswoi węża, wyciśnie z niego olej, a potem sprzeda z tego oleju miksturę komuś jeszcze bardziej łatwowiernemu.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_75b4a560f6e3669dde8f
      kontekst: data.json:scripts.start_createchar.start
      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You've heard Snake Oilers are doing really well out West since The Cows Came Home.  Everybody needs potions and hope in these dark days, and also out West is where all the best snakes live.
      pl: Podobno Olejownicy Wężowi mają się świetnie na Zachodzie od czasu, gdy Krowy Wróciły do Domu. W ciężkich czasach każdy potrzebuje miksturek i nadziei — a najlepsze węże i tak tam rosną.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_db2e8de814434d53c5fa
      kontekst: data.json:scripts.start_createchar.start
      linia: 7
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: I wanna be a Cow Puncher!
      pl: Chcę być Krowobijem!
      status: do_korekty
