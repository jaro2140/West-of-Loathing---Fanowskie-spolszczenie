      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Listen, I'm from the Federal Horrible Wildlife Bureau. You fellas didn't steal a jar of jellybeans, you stole a jar of rare South-of-the-Border Rainbow Earwig eggs. Roy was holding them in quarantine for me 'til I could pick them up for questioning. If you don't hand them over before they hatch, you're all gonna have things like a rhinoceros beetle married a banana slug burrowing into your brains before morning. Now how about it?
      pl: Słuchajcie, jestem z Federalnego Biura Okropnej Dzikiej Przyrody. Nie ukradliście słoika fasolek żelkowych, tylko słój jaj rzadkich Tęczowych Skorków z Południa od Granicy. Roy trzymał je dla mnie na kwarantannie, dopóki nie zabiorę ich na przesłuchanie. Jeśli nie oddacie ich przed wykluciem, to jeszcze przed świtem coś w rodzaju żuka nosorożca skrzyżowanego ze ślimakiem bananowym będzie ryło wam w mózgach. To jak?
