      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Listen, fellas. You stole a jar of candy from an old man. This is such a small, petty, sad little crime, it barely even qualifies as a crime. If this ends up on a wanted poster, you're gonna be the laughing stock of the criminal community. More importantly, what would your mothers think? I'm giving you a chance to turn away from this life of crime before it's too late, and I suggest you take it, because I'm pretty sure this is not a life you're suited to.
      pl: Słuchajcie, chłopaki. Ukradliście staremu człowiekowi słoik słodyczy. To tak drobne, małostkowe i żałosne przestępstewko, że ledwo zasługuje na miano przestępstwa. Jeśli trafi na list gończy, staniecie się pośmiewiskiem całego półświatka. A co ważniejsze, co pomyślałyby wasze matki? Daję wam szansę porzucić przestępcze życie, zanim będzie za późno, i radzę z niej skorzystać, bo jestem prawie pewien, że się do takiego życia nie nadajecie.
