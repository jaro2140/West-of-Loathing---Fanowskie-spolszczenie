      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bartender told you that the Manifest Destiny Railroad Company is hiring, but they're in Dirtwater, not here.
      pl: Barman powiedział ci, że Manifest Destiny Railroad Company zatrudnia, ale są w Dirtwater, nie tutaj.
