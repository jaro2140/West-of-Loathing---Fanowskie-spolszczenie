      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, I'll tell you what I'm gonna do. I'm gonna attack you. And you fellas will probably take me down, but I'm fast, and I'm gonna get my hands on at least one of you. And I'm gonna pop out both of that fella's eyeballs with my thumbs, and I'm gonna put 'em in my mouth and chew 'em up like they was a couple of them jellybeans you stole. And if you haven't killed me by then I'm gonna move on to the next fella. So if there's one of you boys that wants to trade your eyeballs for a jar of goddamn candy, why don't you just go ahead and step forward.
      pl: Powiem ci, co zrobię. Zaatakuję cię. A wy pewnie mnie załatwicie, ale jestem szybki i złapię przynajmniej jednego z was. Wyrwę mu obie gałki oczne kciukami, wsadzę je do ust i przeżuję, jakby to były dwie fasolki żelkowe, które ukradliście. A jeśli do tego czasu mnie nie zabijecie, przejdę do następnego. Więc jeśli któryś z was chce wymienić gałki oczne na słoik cholernych cukierków, to śmiało, wystąp naprzód.
      status: do_korekty
      wspoldzielony_rekord: false
