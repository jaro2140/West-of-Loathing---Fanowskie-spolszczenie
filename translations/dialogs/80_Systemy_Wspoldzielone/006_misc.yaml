      linia: 2
      sekcja_skryptu: start
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Dunno who ya think ya are, stranger, but ya better turn yerself right around and head back the way ya came, less'n ya wanna eat lead.
      pl: Nie wiem, za kogo się masz, nieznajomy, ale lepiej zawróć i wracaj, skąd żeś przyszedł, chyba że chcesz połknąć ołów.
