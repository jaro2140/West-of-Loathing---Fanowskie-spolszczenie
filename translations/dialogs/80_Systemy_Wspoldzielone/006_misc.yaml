      pl: Tak wybiera się klasę postaci.<p>Weź rękawice krowobija — zostaniesz Krowobijem. Krowobije są umięśnieni i lubią bić rzeczy pięściami.<p>Weź fasolę — zostaniesz Fasolomantą. Fasolomanty są mistyczne i uwielbiają gotować oraz rzucać czary na bazie fasoli.<p>Weź węże — zostaniesz Olejownikiem Wężowym. Olejownicy Wężowi mają Ikrę i tworzą silne miksturki oraz subtelne trucizny.
