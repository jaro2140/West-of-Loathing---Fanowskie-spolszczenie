      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Dirtwater is pretty far away.  If you wanna get there, you'll need to buy a horse.
      pl: Dirtwater jest całkiem daleko. Jeśli chcesz tam dotrzeć, musisz kupić konia.
