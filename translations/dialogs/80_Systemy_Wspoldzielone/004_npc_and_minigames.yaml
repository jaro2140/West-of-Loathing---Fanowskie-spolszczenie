      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Okay, seriously, listen up. I know that maybe it''s been a while since you last interfaced with this type of entertainment product. Maybe you''re brand-new to this type of entertainment product in general. So let me explain this to you: although you will have a lot of freedom to make choices, more freedom than is necessary in some places, you are still, fundamentally, inhabiting a character. And the character you''re inhabiting would <i>never, ever</i> walk away from the Winkler-Fuggo wagon if there was <i>any</i> chance it was carrying a package for them.'
      pl: 'Okej, poważnie, słuchaj. Wiem, że może minęło trochę czasu, odkąd ostatnio korzystałeś z tego typu produktu rozrywkowego. Może w ogóle dopiero zaczynasz z tego typu produktem rozrywkowym. Wyjaśnię więc: choć będziesz miał sporo swobody w wyborach — w niektórych miejscach nawet za dużo — wciąż, zasadniczo, wcielasz postać. A postać, którą wcielasz, <i>nigdy, przenigdy</i> nie odwróciłaby się od wozu Winkler-Fuggo, gdyby była choćby <i>cienka</i> szansa, że wiezie dla niej paczkę.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
