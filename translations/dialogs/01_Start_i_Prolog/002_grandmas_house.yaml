    - id: wol_c84a01444bad01218eb5
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.done
      linia: 13
      sekcja_skryptu: done
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: That felt so real, especially the part where I only had one friend in horse school. Maybe I should stop by the Rare Spirit Medium in Portalhand to see if Grandma really does want to talk to me.
      pl: To było takie prawdziwe, zwłaszcza ta część, w której miałem tylko jednego przyjaciela w końskiej szkole. Może powinienem zajrzeć do Rare Spirit Medium w Portalhand i sprawdzić, czy babcia naprawdę chce ze mną porozmawiać.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_a46080b90411d19607a7
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.done
      linia: 14
      sekcja_skryptu: done
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
