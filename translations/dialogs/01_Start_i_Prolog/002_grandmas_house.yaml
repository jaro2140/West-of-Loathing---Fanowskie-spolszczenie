      minigra_lub_feature: false
      uwagi: []
    - id: wol_b9fb1d343ce1ef7b8237
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.buthow
      linia: 17
      sekcja_skryptu: buthow
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It's me, the Winkler-Fuggo driver. I forgot some of your mail. Please don't kick me in the groin like it says in the Winkler-Fuggo song as popularized in the beloved stage musical "A Horse Thief For A Husband."
      pl: To ja, kierowca Winkler-Fuggo. Zapomniałem części waszej poczty. Proszę, nie kopcie mnie w krocze, jak mówi piosenka Winkler-Fuggo spopularyzowana przez uwielbiany musical „Złodziej koni na męża”.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_71c7833bc6e4302f0238
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.buthow
      linia: 18
      sekcja_skryptu: buthow
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I-
      pl: Ja...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_ea0f066680271ca658f8
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.buthow
      linia: 19
      sekcja_skryptu: buthow
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Actually? I'm just gonna slip it under the door and run away. Just in case.
      pl: Właściwie? Po prostu wsunę to pod drzwi i ucieknę. Tak na wszelki wypadek.
