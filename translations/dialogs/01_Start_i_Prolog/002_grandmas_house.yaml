- kolejnosc_w_danych_gry: 1614
  skrypt: grandmadreamsequence_dreamstart
  pomieszczenie: &id001
    id: grandmadreamsequence
    nazwa_en: Grandma's House
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 8
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_50af1dd401794363665e
      kontekst: data.json:scripts.grandmadreamsequence_dreamstart.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You'd thought it would be harder to fall asleep with this uncomfortable helmet on, but you're out as soon as your head hits the pillow.
      pl: Myślałeś, że trudniej będzie zasnąć w tym niewygodnym hełmie, ale zasypiasz, gdy tylko głowa dotknie poduszki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_555f95e527ab9c5ffbbf
      kontekst: data.json:scripts.grandmadreamsequence_dreamstart.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You'd also half-expected that sleeping with Rufus's hat on would give you strange dreams, but you don't dream about anything in particular.
      pl: Też spodziewałeś się w połowie, że spanie w czapce Rufusa da dziwne sny, ale nie śnisz o niczym konkretnym.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_c37fc3ae7dcde5bb07ab
      kontekst: data.json:scripts.grandmadreamsequence_dreamstart.start
      linia: 3
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Well okay then
      pl: No dobra
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: dream
    wpisy:
    - id: wol_1c86e27acfbc4b5b9a7a
      kontekst: data.json:scripts.grandmadreamsequence_dreamstart.dream
      linia: 4
      sekcja_skryptu: dream
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You wake up, refreshed and restored.
      pl: Budzisz się odświeżony i wypoczęty.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7b22c01b8b7592538a0c
      kontekst: data.json:scripts.grandmadreamsequence_dreamstart.dream
      linia: 5
      sekcja_skryptu: dream
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: And hungry, and sober, but at your age you're <i>always</i> both hungry and sober.
      pl: I głodny, i trzeźwy — ale w twoim wieku <i>zawsze</i> jesteś i głodny, i trzeźwy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_da4e87464490921f1ed8
      kontekst: data.json:scripts.grandmadreamsequence_dreamstart.dream
      linia: 6
      sekcja_skryptu: dream
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Boy, I slept <i>great!</i> It's always nice to spend the holidays at Grandma's house where I'm allowed to sleep in and there aren't any farm chores.
      pl: Ale się <i>wyspałem!</i> Miło spędzać święta u babci, gdzie mogę długo spać i nie ma gospodarskich obowiązków.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_f287871ce7a67288a0a5
      kontekst: data.json:scripts.grandmadreamsequence_dreamstart.dream
      linia: 7
      sekcja_skryptu: dream
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Where <i>is</i> Grandma? I feel like she wanted to talk to me about something...
      pl: Gdzie <i>jest</i> babcia? Czuję, że chciała ze mną o czymś porozmawiać...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_8d4450420abc9450d5bf
      kontekst: data.json:scripts.grandmadreamsequence_dreamstart.dream
      linia: 8
      sekcja_skryptu: dream
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Better go look
      pl: Lepiej się rozejrzeć
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
- kolejnosc_w_danych_gry: 1615
  skrypt: grandmadreamsequence_enterkitchen
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 6
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_eca142771b02b0496e76
      kontekst: data.json:scripts.grandmadreamsequence_enterkitchen.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The door opens very slowly. On the edge of your vision, you can see multiple universes being born and dying between the time you twist the knob and the time you're able to step through.
      pl: Drzwi otwierają się bardzo powoli. Na peryferiach wzroku widzisz, jak rodzi się i umiera wiele wszechświatów między momentem, gdy kręcisz klamką, a chwilą, gdy możesz przejść.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_432a693456dcb1b57c96
      kontekst: data.json:scripts.grandmadreamsequence_enterkitchen.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Once you do, you're hit full in the nostrils with the smell of your grandmother's famous cookies. She liked to claim she found the recipe in a locked treasure chest on board a ship full of smugglers that she'd defeated $howdefeat$.
      pl: Gdy to robisz, zapach słynnych ciasteczek babci uderza cię prosto w nozdrza. Lubiła twierdzić, że znalazła przepis w zamkniętej skrzyni skarbów na pokładzie statku pełnego przemytników, których pokonała $howdefeat$.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - $howdefeat$
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_82b40b15b709b3ea852d
      kontekst: data.json:scripts.grandmadreamsequence_enterkitchen.start
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: When you, the observant child, pointed out that it clearly came printed on every bag of Mixwell's Enriched Every-Purpose Flour, she said "Right, that's where the smugglers got it from. But <i>I</i> got it out of their locked treasure chest after kicking their behinds."
      pl: 'Gdy ty, spostrzegawcze dziecko, zauważyłeś, że to wyraźnie było wydrukowane na każdym worku wzbogaconej mąki Mixwell''s, powiedziała: „Tak, stamtąd wzięli to przemytnicy. Ale <i>ja</i> wyciągnęłam to z ich zamkniętej skrzyni skarbów po kopnięciu im tyłków.”'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_abb8e4a18c33bf9536f6
      kontekst: data.json:scripts.grandmadreamsequence_enterkitchen.start
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Whatever you choose to believe, they're tasty cookies.
      pl: W co wybierzesz wierzyć, są smaczne ciastka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_eef157dc89c6a0878a24
      kontekst: data.json:scripts.grandmadreamsequence_enterkitchen.start
      linia: 5
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Maybe she needed me to help her roll out the dough? It's weird that I don't remember.
      pl: Może potrzebowała mojej pomocy przy wałkowaniu ciasta? Dziwne, że nie pamiętam.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_0d5af1785e497f092578
      kontekst: data.json:scripts.grandmadreamsequence_enterkitchen.start
      linia: 6
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Better find out
      pl: Lepiej się dowiedzieć
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
- kolejnosc_w_danych_gry: 1616
  skrypt: grandmadreamsequence_horseschool_grandmaplant
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 56
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_b8fd80fb7f06b3fd669f
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.start
      linia: 1
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Grandma? Please tell me it's really you this time.
      pl: Babciu? Proszę, powiedz, że tym razem naprawdę jesteś sobą.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_330e937341238a15be64
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.start
      linia: 2
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Of course it's me, @firstname@! Jeepers to Pete, I've been chasing you around this dream on my old little legs just trying to get a word in.
      pl: Oczywiście, że to ja, @firstname@! Na Jowisza, gonię cię po tym śnie na moich starych, krótkich nogach, próbując dojść do słowa.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '@firstname@'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_4c7695b12c3e95cb1c87
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.start
      linia: 3
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Did you have some kind of school and/or horse-related trauma experience after I died? Because this place is <i>yikes.</i>
      pl: Czy po mojej śmierci przydarzyła ci się jakaś trauma szkolna i/lub końska? Bo to miejsce jest <i>straszne.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_4c219ec416f5e16a8b71
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.start
      linia: 4
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What? No! Maybe. I don't want to talk about it.
      pl: Co? Nie! Może. Nie chcę o tym rozmawiać.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_aaba73426b17624761f0
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.start
      linia: 5
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Anyway, did you need me for something?
      pl: W każdym razie, potrzebowałeś mnie do czegoś?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: tellmesomething
    wpisy:
    - id: wol_44becd7f65256c31516f
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.tellmesomething
      linia: 6
      sekcja_skryptu: tellmesomething
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: $lastoption$ I've had this weird feeling that you needed me for something.
      pl: $lastoption$ Miałem dziwne przeczucie, że jestem ci do czegoś potrzebny.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - $lastoption$
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_243027258840737ea262
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.tellmesomething
      linia: 7
      sekcja_skryptu: tellmesomething
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: As a matter of fact, I do! There's no time to explain now, though. Meet me at the Rare Spirit Medium in Portalhand. You're about to wake up.
      pl: Tak się składa, że mam! Ale teraz nie ma czasu na wyjaśnienia. Spotkaj się ze mną u Medium od Rzadkich Duchów w Portalhand. Zaraz się obudzisz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
