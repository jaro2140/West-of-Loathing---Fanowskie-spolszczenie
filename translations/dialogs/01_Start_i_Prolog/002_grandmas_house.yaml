      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.done
      linia: 10
      sekcja_skryptu: done
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You're about to wake up.
      pl: Za chwilę się obudzisz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_ff83c985ab78b14e041f
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.done
      linia: 11
      sekcja_skryptu: done
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Which you do, refreshed and restored.
      pl: Co czynisz, odświeżony i wypoczęty.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_36db81340bf998358225
      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.done
      linia: 12
      sekcja_skryptu: done
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: And hungry.  And sober.
      pl: I głodny. I trzeźwy.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
