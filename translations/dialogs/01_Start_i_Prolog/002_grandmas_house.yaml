      kontekst: data.json:scripts.grandmadreamsequence_horseschool_grandmaplant.buthow
      linia: 16
      sekcja_skryptu: buthow
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As you're pondering this, there's a knock on the door of your room.
      pl: Gdy nad tym rozmyślasz, ktoś puka do drzwi twojego pokoju.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
