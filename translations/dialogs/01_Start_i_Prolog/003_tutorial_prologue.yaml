      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, I guess a passing herd sniffed out that it use'ta be a cow ranch, and they attacked. Couple days ago. Happened so fast, I didn't even have time to get my rifle outta the gun safe. Cows smashed in the front door, and a fire started out back by the root cellar. House went up in blazes, just like that.
      pl: Cóż, wydaje mi się, że przechodzące stado wywęszyło, że to niegdyś było ranczo bydła, i zaatakowało. Kilka dni temu. Zdarzyło się to tak szybko, że nie miałam nawet czasu, żeby wyjąć karabin z sejfu. Krowy wyważyły drzwi frontowe, a z tyłu, przy piwniczce, wybuchł pożar. Dom stanął w płomieniach, ot tak.
