      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You start flipping through the goblin language book.  It's confusing at first, but you eventually get so engrossed that by the time you take a break from reading, several BLURFs have passed, and you also know that BLURF is the Goblin word for "hour."
