    - id: wol_39be8dcb230691cb0c72
      kontekst: data.json:scripts.tut_alicebookshelf.book1
      linia: 7
      sekcja_skryptu: book1
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The book tells the story of a legendary treasure -- a massive chest full of premium Meat, secreted (in the 'hidden' sense, not in the 'extruded' sense) in the Western desert by an old cowhand named Curly Butterfield.
      pl: Książka opowiada o legendarnym skarbie — ogromnej skrzyni pełnej wyśmienitego Mięsa, skrytej (w sensie schowanej, a nie wydzielonej) na zachodniej pustyni przez starego kowboja Curly'ego Butterfielda.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
