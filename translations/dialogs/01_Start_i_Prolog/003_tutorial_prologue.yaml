      linia: 8
      sekcja_skryptu: read
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Leaf through "The Life and Works of Fred Ferguson"
      pl: Przekartkuj „Życie i dzieła Freda Fergusona”
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: book2
    wpisy:
    - id: wol_52dcd787cf6eaa460050
      kontekst: data.json:scripts.tut_alicebookshelf.book2
      linia: 9
      sekcja_skryptu: book2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This book purports to be a Civil War surgeon's autobiography, but flipping through it you mostly just find lists of reasons that drinking alcohol is bad.  So... it's actually a work of ludicrous speculative fiction.  Ha ha.
      pl: Książka podaje się za autobiografię chirurga z wojny secesyjnej, ale po przekartkowaniu to głównie listy powodów, dla których alkohol jest zły. Czyli... absurdalna literatura fantastyczna. Ha ha.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_a5f1c4df4b554e52cebc
      kontekst: data.json:scripts.tut_alicebookshelf.book2
      linia: 10
      sekcja_skryptu: book2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: At least there are some useful appendices in the back.  And some diagrams of appendices.
      pl: Przynajmniej z tyłu jest kilka przydatnych dodatków. I schematy wyrostków robaczkowych.
      status: do_korekty
      wspoldzielony_rekord: false
