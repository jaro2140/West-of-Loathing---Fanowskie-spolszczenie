      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It was a raid. See, Ma and Pa used to ranch cattle, back before... well, before they "came home". Pa didn't make it, but Ma and I managed to rebuild. We ranched pigs instead, and she left me the place when she passed.
