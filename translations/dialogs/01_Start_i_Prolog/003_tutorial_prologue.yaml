- kolejnosc_w_danych_gry: 2692
  skrypt: tut_gethardhat
  pomieszczenie: *id001
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 9
  sekcje:
  - etykieta: start
    wpisy:
    - id: wol_7664baed9352b7c5582c
      kontekst: data.json:scripts.tut_gethardhat.start
      linia: 1
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A wave of nausea hits you as you slide the heavy lid off of the chest.  Inside there is a hat.
      pl: Fala mdłości uderza cię, gdy zdejmujesz ciężką pokrywę skrzyni. W środku leży kapelusz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_0b7d18b9fb1f2b6a6591
      kontekst: data.json:scripts.tut_gethardhat.start
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It looks... evil.  And not in an abstract way -- it has eyes, and they look like the eyes of a murderer.  And it has teeth, which look like the teeth of an animal who would be a murderer if animals understood the concept of murder.
      pl: Wygląda... złowrogo. I to nie abstrakcyjnie — ma oczy jak morderca i zęby jak zwierzę, które byłoby mordercą, gdyby zwierzęta rozumiały pojęcie mordu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_18ef536d7a7d48695120
      kontekst: data.json:scripts.tut_gethardhat.start
      linia: 3
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Put...  put it on...
      pl: Załóż... załóż to...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: hardmode
    wpisy:
    - id: wol_f781087eef9f07f648a3
      kontekst: data.json:scripts.tut_gethardhat.hardmode
      linia: 4
      sekcja_skryptu: hardmode
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You have a sense of foreboding.  Something tells you this is a bad idea.
      pl: Masz złe przeczucia. Coś mówi ci, że to zły pomysł.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_88821d042b42ea5be8a5
      kontekst: data.json:scripts.tut_gethardhat.hardmode
      linia: 5
      sekcja_skryptu: hardmode
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: (It's me.  I'm telling you this is a bad idea.  If you put this hat on, you won't ever be able to take it off, and things will be much harder for you.  It will be as though your life is a game, and that game's difficulty level is greatly increased, if you catch my meaning.)
      pl: (To ja. Mówię ci, że to zły pomysł. Jak założysz ten kapsel, nie zdejmiesz go już nigdy — i będzie ci dużo trudniej. Jakby twoje życie było grą, a ktoś właśnie podkręcił poziom trudności, jeśli rozumiesz, o co chodzi.)
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_76a7cb6a5a0e623e66f8
      kontekst: data.json:scripts.tut_gethardhat.hardmode
      linia: 6
      sekcja_skryptu: hardmode
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You also get the sense that your extremely shy horse will not be willing to travel with you if you're wearing that hat.  You'll need to swap for another one at the Hostler before you can leave Boring Springs.
      pl: Czujesz też, że twój niezmiernie nieśmiały koń nie pojedzie z tobą w tym kapeluszu. Musisz wymienić go u stajennego, zanim opuścisz Boring Springs.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: hardmode2
    wpisy:
    - id: wol_abb4a38f39a3efac5c43
      kontekst: data.json:scripts.tut_gethardhat.hardmode2
      linia: 8
      sekcja_skryptu: hardmode2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You grab the terrible hat and put it on your head.  You hear a sigh of pleasure coming from above your forehead as you feel the hat's teeth sink into your skull.
      pl: Chwytasz okropny kapelusz i zakładasz na głowę. Słyszysz westchnienie rozkoszy nad czołem, gdy zęby kapelusza wbijają się w czaszkę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_d3797526b18e24e5d82b
      kontekst: data.json:scripts.tut_gethardhat.hardmode2
      linia: 9
      sekcja_skryptu: hardmode2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"This is going to be great," a voice whispers.'
      pl: '"Będzie cudownie" — szepcze jakiś głos.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_1a2663d382342844ec93
      kontekst: data.json:scripts.tut_gethardhat.hardmode2
      linia: 10
