      pl: Pożegnaj się
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: bro2
    wpisy:
    - id: wol_e15cc400d0b9add9d039
      kontekst: data.json:scripts.cre_brother.bro2
      linia: 3
      sekcja_skryptu: bro2
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: Hey, Rufus.  Time for me to head West.
      pl: Hej, Rufus. Pora ruszyć na Zachód.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_f9378d847df0be845a76
      kontekst: data.json:scripts.cre_brother.bro2
      linia: 4
      sekcja_skryptu: bro2
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: I still don't understand why you're leaving.
      pl: Nadal nie rozumiem, po co wyjeżdżasz.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_912ec4b1df76ca372a6d
      kontekst: data.json:scripts.cre_brother.bro2
      linia: 5
      sekcja_skryptu: bro2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He's got a point, you know.  Why <i>are</i> you going West, anyway?
      pl: Ma trochę racji, wiesz. Po co <i>właściwie</i> jedziesz na Zachód?
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_050e15a6b28afc5f4af7
      kontekst: data.json:scripts.cre_brother.bro2
      linia: 6
      sekcja_skryptu: bro2
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: To help people
      pl: Żeby pomagać ludziom
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: bro2a
    wpisy:
    - id: wol_2b2e73dfa055a799673a
      kontekst: data.json:scripts.cre_brother.bro2a
      linia: 7
      sekcja_skryptu: bro2a
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: You've read the papers, Rufus.  The people out West are in trouble.  They need all the help they can get.
      pl: Czytałeś gazety, Rufusie. Ludzie na Zachodzie są w tarapatach. Potrzebują każdej pomocy, jaką mogą otrzymać.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: bro3
    wpisy:
    - id: wol_1b54ef1cde54bf13dc23
      kontekst: data.json:scripts.cre_brother.bro3
      linia: 8
      sekcja_skryptu: bro3
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: But it's so dangerous!  60% of the people who go West get killed within a year, and that statistic is from <i>before</i> The Cows Came Home.
      pl: Ale to takie niebezpieczne! 60% osób jadących na Zachód ginie w ciągu roku — a ta statystyka pochodzi z czasów <i>przed</i> Powrotem Krów.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_0e99b400a2662849d905
      kontekst: data.json:scripts.cre_brother.bro3
      linia: 9
      sekcja_skryptu: bro3
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: I'll be okay.
      pl: Dam sobie radę.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: bro4
