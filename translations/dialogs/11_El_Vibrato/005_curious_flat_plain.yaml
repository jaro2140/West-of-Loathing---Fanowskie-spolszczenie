      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, <i>un</i>push it, consarnit! My boots're fillin' up with water!
      pl: <i>Odsuńcie</i> to, consarnit! Moje buty wypełniają się wodą!
