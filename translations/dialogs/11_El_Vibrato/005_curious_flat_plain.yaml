      linia: 4
      sekcja_skryptu: alice
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I'd hope if someone made a moon-blowing-up machine, they'd at least put a warning label on it.
      pl: Miałbym nadzieję, że jeśli ktoś zbudował maszynę do wysadzania księżyca, to przynajmniej przykleił na niej etykietę ostrzegawczą.
