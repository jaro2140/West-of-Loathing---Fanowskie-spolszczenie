    - id: wol_7d567830e6ab278d3776
      kontekst: data.json:scripts.planarjunction_cantina_bartender.menu
      linia: 30
      sekcja_skryptu: menu
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: All right, to start out with, I've got some chilled blue flame agave spheres from Geckotopia. That's a plane almost exactly like your mortal West except lizards evolved to be the dominant species and everything is a lot classier and more genteel. So your uneducated palate will probably parse this as an especially nice tequila, much to your shame.
      pl: Na początek mam schłodzone kule niebieskopłomiennej agawy z Geckotopii. To plan niemal identyczny z waszym śmiertelnym Zachodem, tyle że jaszczurki stały się gatunkiem dominującym, a wszystko jest znacznie bardziej eleganckie i dystyngowane. Twój niewykształcony smak odbierze to zapewne jako wyjątkowo dobrą tequilę, ku twojej hańbie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: menu2
    wpisy:
    - id: wol_2ca1336ae046159a4d7b
      kontekst: data.json:scripts.planarjunction_cantina_bartender.menu2
      linia: 33
      sekcja_skryptu: menu2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Next is some fermented spider blood from the Domain of Things That Make You Question Why You're There. It's a bit of an acquired taste for Cowpokians, but I get a lot of requests for spider booze, so I try to have plenty on hand. Also it's good for your veins, they tell me?
      pl: Następnie trochę sfermentowanej krwi pająka z Domeny Rzeczy, Które Każą Ci Się Zastanawiać, Czemu Tam Jesteś. Kowbojanie muszą się trochę przyzwyczaić do tego smaku, ale dostaję sporo próśb o pajęczy trunek, więc staram się mieć go pod dostatkiem. Podobno dobrze robi na żyły?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: menu3
    wpisy:
    - id: wol_dee69f32b6a6231a7d93
      kontekst: data.json:scripts.planarjunction_cantina_bartender.menu3
      linia: 36
      sekcja_skryptu: menu3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: 'For my final suggestion, well, it wouldn''t be a trip to Hell without a classic Hell concoction, and there''s no concoction more hellish than the Eternal Regret: a layered cocktail featuring mayonnaise, pickles, pineapple juice, and a live fish slowly dissolving in the acid. No, before you ask, it''s <i>not</i> vegan.'
      pl: 'Na koniec cóż — podróż do Piekła nie byłaby pełna bez klasycznej piekielnej mikstury, a nie ma nic bardziej piekielnego niż Wieczny Żal: warstwowy koktajl z majonezu, ogórków kiszonych, soku ananasowego i żywej ryby powoli rozpuszczającej się w kwasie. Nie, zanim zapytasz: <i>nie</i> jest wegański.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
