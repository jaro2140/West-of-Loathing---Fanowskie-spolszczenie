      linia: 6
      sekcja_skryptu: youheardme
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I did, I'm just surprised you said it out loud, that's all. Most of our guests pretend to be psychologically fine with all these clowns while they're checking in, out of some kind of malformed politeness, I guess.
      pl: Owszem, jestem tylko zaskoczony, że powiedziałeś to na głos, tyle. Większość naszych gości udaje, że jest psychicznie okej z tymi wszystkimi klaunami przy zameldowaniu, chyba z jakiejś wypaczonej grzeczności.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_759fcb288357f93305c4
      kontekst: data.json:scripts.planarjunction_hotel_clerk.youheardme
      linia: 7
      sekcja_skryptu: youheardme
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, don't expect that from me. My top priority right now is to clearly communicate that I will <i>not</i> be checking into this hotel, because it's got <i>way</i> too many clowns in it.
      pl: Nie oczekuj tego ode mnie. Moim priorytetem w tej chwili jest jasne zakomunikowanie, że <i>nie</i> zamelduję się w tym hotelu, ponieważ jest w nim <i>stanowczo</i> za dużo klaunów.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: wol_7d6d101e6065f89a4860
      kontekst: data.json:scripts.planarjunction_hotel_clerk.youheardme
      linia: 8
      sekcja_skryptu: youheardme
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: That's fair! If you're not fond of clowns, might I suggest taking respite in our interplanar tavern? It's open to the public and there's not a clown in sight.
      pl: Rozumiem! Jeśli nie przepadasz za klaunami, proponuję odpoczynek w naszej międzyplanarnej tawernie. Jest otwarta dla wszystkich i nie zobaczysz tam ani jednego klauna.
