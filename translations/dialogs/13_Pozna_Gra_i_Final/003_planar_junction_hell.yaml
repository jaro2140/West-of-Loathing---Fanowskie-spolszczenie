      en: '%planarjunction_alienword% %planarjunction_alienword% (All right, to start out with, I''ve got some chilled blue flame agave spheres from Geckotopia. That''s a plane almost exactly like your mortal West except lizards evolved to be the dominant species and everything is a lot classier and more genteel. So you''ll probably find this similar to an especially good tequila with an aftertaste of sun-dried pepper.)'
