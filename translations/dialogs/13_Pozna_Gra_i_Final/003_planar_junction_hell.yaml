      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Okay, I've done you the service of choosing the top three non-Cowpokian beverages that I think will appeal to your Cowpokian palate along the axes of taste, mouthfeel, and not instantly melting your organs.
      pl: Dobra, wyświadczyłem ci przysługę i wybrałem trzy najlepsze napoje niekowpokijskie, które moim zdaniem przypadną do gustu twojemu kowpokijskiemu podniebieniu pod względem smaku, odczucia w ustach i tego, że nie rozpuszczają natychmiast twoich organów.
