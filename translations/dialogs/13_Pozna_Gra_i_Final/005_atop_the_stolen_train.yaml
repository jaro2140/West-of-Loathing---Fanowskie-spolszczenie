      linia: 21
      sekcja_skryptu: russ2
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I rescued him from a cat when he was only just out of the nest, and raised him as a pet. I set him free when I left home recently.
      pl: Uratowałem go przed kotem, kiedy ledwo co wyfrunął z gniazda, i wychowałem jak domowe zwierzątko. Niedawno, wyjeżdżając z domu, wypuściłem go na wolność.
