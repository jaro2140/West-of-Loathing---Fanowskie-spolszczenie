      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, I'm still gonna be doing a lot of traveling after this, I figure, so I can't really drag Russell along with me. Buuuuut I bet Russell wouldn't mind being pals with a nice lady in Frisco who helped save the train. Whaddya think, Russ?
      pl: Cóż, nadal będę dużo podróżował po tym, domyślam się, więc nie mogę wziąć Russella ze sobą. Buuuuut założę się, że Russell nie miałby nic przeciwko byciu kumplem z miłą kobietą w Frisco, która pomogła uratować pociąg. Co myślisz, Russ?
      status: do_korekty
